# ==============================================================================
# Beispiel für config/secrets.yaml – die Werte, die die Geräte-Pakete lesen.
# Nur die Blöcke übernehmen, deren Paket du nutzt, und an deine Anlage anpassen.
# ==============================================================================

# --- Sungrow Wechselrichter (modbus_sungrow.yaml, Paket von mkaiser) ----------
sungrow_modbus_host_ip: 192.168.1.20          # IP des Wechselrichters (WiNet-S oder LAN)
sungrow_modbus_port: 502
sungrow_modbus_device_address: 1              # Modbus-Adresse des Wechselrichters
sungrow_modbus_sbr_device_address: 200        # Modbus-Adresse des Batteriespeichers (SBR)
sungrow_modbus_wait_milliseconds: 20          # Pause zwischen zwei Anfragen
sungrow_modbus_battery_max_power: 5000        # höchste Lade-/Entladeleistung des Akkus in W

# --- Mennekes AMTRON Charge Control (modbus_mennekes.yaml) ------------------
mennekes_modbus_host_ip: 192.168.1.30         # IP der Wallbox
mennekes_modbus_port: 502
mennekes_modbus_device_address: 1             # die Wallbox antwortet auf jede Adresse 1–255
mennekes_modbus_wait_milliseconds: 100        # Pause zwischen zwei Anfragen
