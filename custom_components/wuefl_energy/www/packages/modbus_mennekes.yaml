# ==============================================================================
# MENNEKES AMTRON CHARGE CONTROL
#
# Import:
#   1. Datei nach config/packages/ kopieren (packages: !include_dir_named packages)
#   2. In secrets.yaml: mennekes_modbus_host_ip, mennekes_modbus_port,
#      mennekes_modbus_device_address, mennekes_modbus_wait_milliseconds
#   3. HA neu starten, im W-Energie Dashboard unter Zuordnung die Vorlage
#      "MENNEKES AMTRON CHARGE CONTROL" anwenden
#
# Gesteuert wird über die Zahl "Mennekes HEMS Stromvorgabe" (0 A = Pause).
# Die Vorlage trägt sie in der Zuordnung unter "Steuerung durch die
# Automation" ein – die W-Energie-Automation schreibt den Ladestrom dann
# selbst dorthin, ein eigenes Umrechnungs-Paket ist nicht mehr nötig.
#
# Basierend auf der Spezifikation: https://www.mennekes.de/fileadmin/MEN-Deutschland/emobility/01_documents/04_installer/ECU_modbus_tcp_server_spec_rev_1.07.pdf
# Lokal "mennekes_modbus_charge_controll.pdf"
# ==============================================================================

modbus:
  - name: "mennekes_wallbox"
    type: tcp
    host: !secret mennekes_modbus_host_ip
    port: !secret mennekes_modbus_port
    delay: 2
    timeout: 5
    retries: 3
    message_wait_milliseconds: !secret mennekes_modbus_wait_milliseconds

    sensors:
      # --- BLOCK ZÄHLER: Register 206–227, elf 32-Bit-Werte ---
      # Leistung L1–L3 (W), Strom L1–L3 (mA), Gesamtenergie (Wh),
      # Ladeleistung (W), Spannung L1–L3 (V)
      - name: "Mennekes Block Zähler"
        unique_id: mennekes_block_zaehler
        address: 206
        device_address: !secret mennekes_modbus_device_address
        input_type: holding
        data_type: custom
        count: 22
        structure: ">11L"
        scan_interval: &scan 30

      # --- BLOCK STATUS: Register 104–152 ---
      # 104 OCPP-Status, 122 Fahrzeugstatus, 124 Verfügbarkeit,
      # 131 sicherer Strom, 132 Verbindungsfrist, 152 Steckerverriegelung
      # (x = Register dazwischen überspringen)
      - name: "Mennekes Block Status"
        unique_id: mennekes_block_status
        address: 104
        device_address: !secret mennekes_modbus_device_address
        input_type: holding
        data_type: custom
        count: 49
        structure: ">H34xH2xH12xHH38xH"
        scan_interval: *scan

      # --- BLOCK LADEVORGANG: Register 706–717 ---
      # 706 signalisierter Strom, 715 Höchststrom Fahrzeug,
      # 716 Energie des Ladevorgangs (Wh, 32 Bit)
      - name: "Mennekes Block Ladevorgang"
        unique_id: mennekes_block_ladevorgang
        address: 706
        device_address: !secret mennekes_modbus_device_address
        input_type: holding
        data_type: custom
        count: 12
        structure: ">H16xHL"
        scan_interval: *scan

      # --- STEUERUNG (Rückmeldung) ---
      # HEMS-Stromvorgabe lesen. Geschrieben wird über die Template-Zahl
      # "Mennekes HEMS Stromvorgabe" weiter unten – die Modbus-Integration von
      # HA kennt keine Zahlen-Entitäten (kein "numbers:").
      - name: "Mennekes HEMS Stromvorgabe Raw"
        unique_id: mennekes_hems_stromvorgabe_raw
        address: 1000 # HEMS_CURRENT_LIMIT
        device_address: !secret mennekes_modbus_device_address
        input_type: holding
        data_type: uint16
        unit_of_measurement: "A"
        scan_interval: *scan


template:
  # ---------------------------------------------------------------------------
  # Einzelwerte aus den Modbus-Blöcken. Fällt ein Block aus, sind seine Werte
  # nicht verfügbar – es wird nichts geraten.
  # ---------------------------------------------------------------------------
  - sensor:
    # --- Block Zähler ---
    - name: "Mennekes Leistung L1"
      unique_id: mennekes_leistung_l1
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[0] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[0] | is_number }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
    - name: "Mennekes Leistung L2"
      unique_id: mennekes_leistung_l2
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[1] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[1] | is_number }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
    - name: "Mennekes Leistung L3"
      unique_id: mennekes_leistung_l3
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[2] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[2] | is_number }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
    - name: "Mennekes Strom L1"
      unique_id: mennekes_strom_l1
      state: "{{ (states('sensor.mennekes_block_zahler').split(',')[3] | float * 0.001) | round(1) }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[3] | is_number }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
    - name: "Mennekes Strom L2"
      unique_id: mennekes_strom_l2
      state: "{{ (states('sensor.mennekes_block_zahler').split(',')[4] | float * 0.001) | round(1) }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[4] | is_number }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
    - name: "Mennekes Strom L3"
      unique_id: mennekes_strom_l3
      state: "{{ (states('sensor.mennekes_block_zahler').split(',')[5] | float * 0.001) | round(1) }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[5] | is_number }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
    - name: "Mennekes Gesamtenergie"
      unique_id: mennekes_total_energy
      state: "{{ (states('sensor.mennekes_block_zahler').split(',')[6] | float * 0.001) | round(2) }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[6] | is_number }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
    - name: "Mennekes aktuelle Ladeleistung"
      unique_id: mennekes_current_power
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[7] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[7] | is_number }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
    - name: "Mennekes Spannung L1"
      unique_id: mennekes_spannung_l1
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[8] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[8] | is_number }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
    - name: "Mennekes Spannung L2"
      unique_id: mennekes_spannung_l2
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[9] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[9] | is_number }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
    - name: "Mennekes Spannung L3"
      unique_id: mennekes_spannung_l3
      state: "{{ states('sensor.mennekes_block_zahler').split(',')[10] | int }}"
      availability: "{{ states('sensor.mennekes_block_zahler').split(',') | count == 11 and states('sensor.mennekes_block_zahler').split(',')[10] | is_number }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
    # --- Block Status (Rohwerte) ---
    - name: "Mennekes OCPP Status Raw"
      unique_id: mennekes_ocpp_status_raw
      state: "{{ states('sensor.mennekes_block_status').split(',')[0] | int }}"
      availability: "{{ states('sensor.mennekes_block_status').split(',') | count == 6 and states('sensor.mennekes_block_status').split(',')[0] | is_number }}"
    - name: "Mennekes Fahrzeugstatus Raw"
      unique_id: mennekes_fahrzeugstatus_raw
      state: "{{ states('sensor.mennekes_block_status').split(',')[1] | int }}"
      availability: "{{ states('sensor.mennekes_block_status').split(',') | count == 6 and states('sensor.mennekes_block_status').split(',')[1] | is_number }}"
    - name: "Mennekes CP Verfügbarkeit Raw"
      unique_id: mennekes_cp_verfuegbarkeit_raw
      state: "{{ states('sensor.mennekes_block_status').split(',')[2] | int }}"
      availability: "{{ states('sensor.mennekes_block_status').split(',') | count == 6 and states('sensor.mennekes_block_status').split(',')[2] | is_number }}"
    - name: "Mennekes sicherer Strom"
      unique_id: mennekes_sicherer_strom
      state: "{{ states('sensor.mennekes_block_status').split(',')[3] | int }}"
      availability: "{{ states('sensor.mennekes_block_status').split(',') | count == 6 and states('sensor.mennekes_block_status').split(',')[3] | is_number }}"
      unit_of_measurement: "A"
      device_class: current
    - name: "Mennekes Verbindungsfrist"
      unique_id: mennekes_verbindungsfrist
      state: "{{ states('sensor.mennekes_block_status').split(',')[4] | int }}"
      availability: "{{ states('sensor.mennekes_block_status').split(',') | count == 6 and states('sensor.mennekes_block_status').split(',')[4] | is_number }}"
      unit_of_measurement: "s"
    - name: "Mennekes Steckerverriegelung Raw"
      unique_id: mennekes_steckerverriegelung_raw
      state: "{{ states('sensor.mennekes_block_status').split(',')[5] | int }}"
      availability: "{{ states('sensor.mennekes_block_status').split(',') | count == 6 and states('sensor.mennekes_block_status').split(',')[5] | is_number }}"
    # --- Block Ladevorgang ---
    # Was die Wallbox dem Auto wirklich signalisiert. Liegt das unter der
    # HEMS-Vorgabe, begrenzt die Wallbox selbst (Kabel, Lastmanagement oder
    # der Rückfall nach einem Verbindungsausfall).
    - name: "Mennekes signalisierter Strom"
      unique_id: mennekes_signalisierter_strom
      state: "{{ states('sensor.mennekes_block_ladevorgang').split(',')[0] | int }}"
      availability: "{{ states('sensor.mennekes_block_ladevorgang').split(',') | count == 3 and states('sensor.mennekes_block_ladevorgang').split(',')[0] | is_number }}"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
    # Was Auto und Kabel höchstens können
    - name: "Mennekes Höchststrom Fahrzeug"
      unique_id: mennekes_hoechststrom_fahrzeug
      state: "{{ states('sensor.mennekes_block_ladevorgang').split(',')[1] | int }}"
      availability: "{{ states('sensor.mennekes_block_ladevorgang').split(',') | count == 3 and states('sensor.mennekes_block_ladevorgang').split(',')[1] | is_number }}"
      unit_of_measurement: "A"
      device_class: current
    - name: "Mennekes Energie Aktueller Ladevorgang"
      unique_id: mennekes_energie_aktueller_ladevorgang
      state: "{{ (states('sensor.mennekes_block_ladevorgang').split(',')[2] | float * 0.001) | round(2) }}"
      availability: "{{ states('sensor.mennekes_block_ladevorgang').split(',') | count == 3 and states('sensor.mennekes_block_ladevorgang').split(',')[2] | is_number }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total

  # ---------------------------------------------------------------------------
  # HEMS-Stromvorgabe als einstellbare Zahl: 0 A = Pause, 6–16 A = Ladestrom.
  # Liest Register 1000 über den Raw-Sensor und schreibt per modbus.write_register.
  # ---------------------------------------------------------------------------
  - number:
    - name: "Mennekes HEMS Stromvorgabe"
      unique_id: mennekes_hems_stromvorgabe
      icon: mdi:current-ac
      unit_of_measurement: "A"
      min: 0
      max: 16   # 11-kW-Wallbox; bei 22 kW auf 32 erhöhen
      step: 1
      state: "{{ states('sensor.mennekes_hems_stromvorgabe_raw') | int(0) }}"
      availability: "{{ states('sensor.mennekes_hems_stromvorgabe_raw') | is_number }}"
      set_value:
        - action: modbus.write_register
          data:
            hub: mennekes_wallbox
            slave: !secret mennekes_modbus_device_address
            address: 1000
            value: "{{ value | int }}"
        - delay:
            milliseconds: 200
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.mennekes_hems_stromvorgabe_raw

  - sensor:
    # Übersetzung für Register 104
    - name: "Mennekes OCCP Status"
      unique_id: mennekes_status_text
      icon: mdi:information-outline
      state: >
        {% set mapper = {
          0: 'Verfügbar (Frei)',
          1: 'Belegt durch Auto',
          2: 'Reserviert',
          3: 'Nicht verfügbar',
          4: 'Fehler',
          5: 'Vorbereitung',
          6: 'Laden aktiv',
          7: 'Pausiert (Wallbox)',
          8: 'Pausiert (Auto)',
          9: 'Beendet'
        } %}
        {{ mapper.get(states('sensor.mennekes_ocpp_status_raw')|int(-1), 'Unbekannt') }}

    # Übersetzung für Register 122
    - name: "Mennekes Kabel & Fahrzeug"
      unique_id: mennekes_kabel_fahrzeug_text
      icon: mdi:ev-plug-type2
      state: >
        {% set mapper = {
          1: 'Kein Auto angesteckt (State A)',
          2: 'Auto angesteckt, lädt nicht (State B)',
          3: 'Auto lädt (State C)',
          4: 'Lädt mit Lüftung (State D)',
          5: 'Fehler (State E)'
        } %}
        {{ mapper.get(states('sensor.mennekes_fahrzeugstatus_raw')|int(-1), 'Unbekannt') }}

    # Übersetzung für Register 152
    - name: "Mennekes Steckerverriegelung"
      unique_id: mennekes_stecker_text
      icon: >
        {% if states('sensor.mennekes_steckerverriegelung_raw')|int(-1) == 1 %}
          mdi:lock
        {% else %}
          mdi:lock-open-variant
        {% endif %}
      state: >
        {% set mapper = {
          0: 'Entriegelt',
          1: 'Verriegelt'
        } %}
        {{ mapper.get(states('sensor.mennekes_steckerverriegelung_raw')|int(-1), 'Unbekannt') }}

    # Übersetzung für Register 124
    - name: "Mennekes Betriebsbereitschaft"
      unique_id: mennekes_betriebsbereitschaft_text
      icon: mdi:power-plug
      state: >
        {% set mapper = {
          0: 'Gesperrt / Fehler',
          1: 'Betriebsbereit'
        } %}
        {{ mapper.get(states('sensor.mennekes_cp_verfuegbarkeit_raw')|int(-1), 'Unbekannt') }}

  - binary_sensor:
    # Bereit zum Laden; bei Modbus-Ausfall bleibt der alte Zustand
    - name: "Mennekes Ready for Charge"
      unique_id: mennekes_ready_for_charge
      device_class: plug
      icon: mdi:ev-station
      state: >
        {% set car_raw = states('sensor.mennekes_fahrzeugstatus_raw') | int(-1) %}
        {% set ocpp_raw = states('sensor.mennekes_ocpp_status_raw') | int(-1) %}
        {% set old_bool = is_state('binary_sensor.mennekes_ready_for_charge', 'on') %}
        {% if car_raw != -1 and ocpp_raw != -1 %}
          {{ (car_raw == 2 and ocpp_raw in [0, 1, 5]) or (car_raw in [2, 3, 4] and ocpp_raw in [7, 8]) }}
        {% else %}
          {{ old_bool }}
        {% endif %}

  # ---------------------------------------------------------------------------
  # Mennekes Status – der Text, mit dem das W-Energie Dashboard arbeitet.
  # Als einziger Sensor gepuffert: trigger-basiert, damit HA den letzten
  # Zustand nach einem Neustart wiederherstellt; sind die Register gerade
  # nicht lesbar, bleibt der letzte gültige Text stehen.
  # ---------------------------------------------------------------------------
  - trigger:
      - trigger: state
        entity_id:
          - sensor.mennekes_ocpp_status_raw
          - sensor.mennekes_fahrzeugstatus_raw
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Mennekes Status"
        unique_id: mennekes_status
        icon: mdi:ev-station
        state: >
          {% set car_raw = states('sensor.mennekes_fahrzeugstatus_raw') | int(-1) %}
          {% set ocpp_raw = states('sensor.mennekes_ocpp_status_raw') | int(-1) %}
          {% set old = this.state if this is defined and this.state not in ['unknown', 'unavailable', None] else 'Status unklar (Initialisierung)' %}

          {# Reihenfolge wichtig: Pausen und "beendet" vor "lädt", weil das
             Fahrzeugregister auch in der Pause noch State C melden kann. #}
          {% if car_raw == -1 or ocpp_raw == -1 %}
            {{ old }}
          {% elif car_raw == 1 %}
            Kein Auto angesteckt
          {% elif car_raw == 5 or ocpp_raw == 4 %}
            Fehler an der Wallbox
          {% elif car_raw in [2, 3, 4] and ocpp_raw == 9 %}
            Auto angesteckt, laden beendet
          {% elif ocpp_raw == 7 %}
            Laden pausiert, durch HA
          {% elif ocpp_raw == 8 %}
            Laden pausiert, durch Auto
          {% elif ocpp_raw == 6 or car_raw in [3, 4] %}
            Auto lädt
          {% elif car_raw == 2 %}
            Auto angesteckt, noch nicht gestartet
          {% else %}
            {{ old }}
          {% endif %}
