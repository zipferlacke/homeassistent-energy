# =======================================================================
# wuefl_automation.yaml
# Dynamic Wallbox & Energy Management Automation
#
# Wird von der Integration automatisch in automations.yaml eingetragen und
# bei jedem Update aktualisiert – nicht mehr von Hand kopieren. Liegt diese
# Datei noch unter config/packages/, bitte dort löschen (sonst läuft die
# Regelung doppelt). Die Integration benennt eine alte Kopie dort
# selbst in wuefl_automation.yaml.alt um.
#
# "Nur lesen" (Zuordnung) gibt die Anlage frei: Beim Einschalten setzt die
# Automation einmal alles zurück, was sie schreiben kann (Wallbox: voller
# Strom, Laden erlaubt, 3-phasig; Hausakku: Normalbetrieb) – danach schreibt
# sie nichts mehr, andere Steuerungen haben freie Hand. Nach dem Ausschalten
# regelt sie beim nächsten Durchlauf wieder.
#
# Alle Entitäten kommen aus der Zuordnung (sensor.we_config, Attribut
# "config"). Dort steht je Pfad entweder der Helfer der Integration
# (z. B. select.we_charge_type_carport) oder die eigene Entität, die du in
# der Zuordnung gewählt hast.
#
# Ablauf: erst werden alle Zielwerte berechnet (je Wallbox an/aus, Leistung,
# dazu der Akku-Modus), danach wird nur geschrieben, was sich wirklich
# ändert – kein Dauerfeuer auf Modbus/Wechselrichter. Im Trace stehen die
# Messwerte je Wallbox unter "boxen", die Zielwerte unter "plan".
#
# Auffrischen: Alle 5 min schreibt die Automation Ladestrom, Laden/Pause und
# den Akku-Modus noch einmal, auch wenn sich nichts geändert hat – falls ein
# Gerät den Wert verloren hat oder jemand anderes ihn überschrieben hat.
# Die Phasen werden dabei nicht neu gesetzt (manche Wallboxen unterbrechen
# dafür das Laden). Bei "Nur lesen" wird auch nicht aufgefrischt.
#
# Mehrere Wallboxen: Jede hat ihren eigenen Lademodus. "Schnell" lädt mit
# voller Leistung. Den Solarüberschuss bekommen die Wallboxen in der
# Reihenfolge der Zuordnung – die erste zuerst, der Rest geht an die nächste.
# Was eine Wallbox nach zwei Minuten nicht abnimmt (Auto voll oder lädt nur
# 1-phasig), bleibt für die nächste übrig.
#
# Aussetzer: Ist ein Messwert (Netz, Hausakku, Ladeleistung) kurz nicht
# erreichbar, regelt die Automation weiter wie bisher. Erst wenn er länger
# als 30 s fehlt, stoppt sie das Solarladen der betroffenen Wallbox (bzw. bei
# Netz/Akku aller Wallboxen). Den Ladestand des Autos betrifft das nicht –
# Autos melden sich oft schlafen, dann gilt das Ladeziel einfach nicht.
#
# Wolke: Fällt der Überschuss unter die Mindestleistung, lädt eine laufende
# Wallbox noch bis zu 1 min mit Mindestleistung weiter; der Hausakku
# überbrückt (er wird dafür nicht gesperrt). Reicht es danach immer noch
# nicht, stoppt sie. Freigabe-Helfer = 2 heißt "überbrückt gerade".
#
# Wallbox-Steuerung: Die Soll-Leistung landet immer in den Helfern der
# Integration (send_power / activate_station). Ist unter "Steuerung durch
# die Automation" eine Ladestrom-Vorgabe zugeordnet, schreibt die
# Automation zusätzlich direkt dorthin – in Ampere, mit Pause und bei
# Wallboxen mit Phasenumschaltung 1- oder 3-phasig. Damit braucht keine
# Wallbox mehr ein eigenes Umrechnungs-Paket.
#
# Vorzeichen wie in der Zuordnung beschrieben:
#   Netz     positiv = Bezug,     negativ = Einspeisung
#   Batterie positiv = entladen,  negativ = laden
# =======================================================================

automation:
  - id: wuefl_wallbox_und_speicher_regelung
    alias: "wuefl – Wallbox & Energiemanagement"
    # queued: das Einschalten von "Nur lesen" darf nicht verloren gehen, nur
    # weil gerade ein Durchlauf schreibt
    mode: queued
    max: 3
    max_exceeded: silent

    trigger:
      - trigger: time_pattern
        seconds: "/30"
      # Alle 5 min alles noch einmal schreiben (siehe "Auffrischen" oben)
      - trigger: time_pattern
        minutes: "/5"
        id: auffrischen
      # Globale Helfer haben feste Namen – Änderungen sofort umsetzen
      - trigger: state
        entity_id:
          - select.we_priority_charging
          - switch.we_battery_ussage_charging
          - switch.we_charge_battery_with_grid_bad_weather
          - number.we_battery_ussage_limit_charging
          - number.we_price_limit_charging
      # Zuordnung gespeichert ("Nur lesen" an: freigeben, aus: wieder regeln)
      - trigger: state
        entity_id: sensor.we_config
      # Wallbox-Helfer heißen nach der Wallbox – daher über die Zuordnung
      - trigger: template
        value_template: >
          {% set cfg = state_attr('sensor.we_config', 'config') or {} %}
          {% set ns = namespace(ids=[]) %}
          {% for wb in cfg.get('wallboxes') or [] if wb is mapping %}
            {% set ns.ids = ns.ids + [wb.get('charge_type'), wb.get('charge_percent_limit'), wb.get('ignore_percent_limit')]
               | select('string') | list %}
          {% endfor %}
          {{ ns.ids | count > 0 and
             expand(ns.ids) | map(attribute='last_changed') | max > now() - timedelta(seconds=5) }}

    variables:
      # --- Zuordnung ------------------------------------------------------
      cfg: "{{ state_attr('sensor.we_config', 'config') or {} }}"
      regeln: "{{ cfg.get('wallboxes_config') or {} }}"
      grid: "{{ cfg.get('grid') or {} }}"
      batterien: "{{ (cfg.get('battery') or []) | select('mapping') | list }}"
      batt: "{{ (batterien + [{}])[0] }}"
      akku_steuerung: "{{ batt.get('control') or {} }}"

      # --- Nur lesen --------------------------------------------------------
      read_only: "{{ (cfg.get('settings') or {}).get('read_only') or false }}"
      # Gerade eingeschaltet? Nur dann wird einmal alles zurückgesetzt – nicht
      # bei jedem Durchlauf und nicht nach einem Neustart von HA.
      freigeben: >
        {% set t = trigger if trigger is defined else {} %}
        {% if read_only and t.get('platform') == 'state' and t.get('entity_id') == 'sensor.we_config'
              and t.get('from_state') is not none %}
          {% set alt = (t.from_state.attributes.get('config') or {}).get('settings') or {} %}
          {{ not (alt.get('read_only') or false) }}
        {% else %}{{ false }}{% endif %}

      auffrischen: "{{ trigger is defined and trigger.id == 'auffrischen' }}"

      # --- Entitäten (leer = nicht zugeordnet) ------------------------------
      grid_power_entity: "{{ grid.get('live', '') }}"
      price_entity: "{{ grid.get('price_import', '') }}"
      priority_entity: "{{ regeln.get('priority_charging', '') }}"
      use_entity: "{{ regeln.get('battery_ussage_charging', '') }}"
      reserve_entity: "{{ regeln.get('battery_ussage_limit_charging', '') }}"
      limit_entity: "{{ regeln.get('price_limit_charging', '') }}"
      bad_weather_entity: "{{ regeln.get('charge_battery_bad_weather', '') }}"
      batt_soc_entity: "{{ batt.get('percent', '') }}"
      batt_stop_discharging: "{{ akku_steuerung.get('mode_stop_discharging', '') }}"
      batt_force_charge: "{{ akku_steuerung.get('mode_start_charging', '') }}"
      batt_normal_mode: "{{ akku_steuerung.get('normal_mode', '') }}"

      has_battery: "{{ batterien | count > 0 }}"
      # Szenen stehen auf "unknown", bis sie einmal aktiviert wurden – deshalb
      # nur prüfen, ob die Entität existiert und erreichbar ist
      can_control_battery: "{{ batt_normal_mode != '' and expand(batt_normal_mode) | count > 0 and states(batt_normal_mode) != 'unavailable' }}"

      # --- Einstellungen ----------------------------------------------------
      prio: "{{ states(priority_entity) }}"
      freigabe: "{{ is_state(use_entity, 'on') }}"
      netzladen_erlaubt: "{{ is_state(bad_weather_entity, 'on') }}"
      reserve: "{{ states(reserve_entity) | float(20) }}"
      grenze: "{{ states(limit_entity) | float(0) }}"
      # Preis in ct/kWh, €-Sensoren werden umgerechnet
      preis: >
        {% set v = states(price_entity) | float(none) %}
        {% set u = (state_attr(price_entity, 'unit_of_measurement') or '') | lower %}
        {% if v is none %}{{ 999 }}
        {% elif ('€' in u or 'eur' in u) and 'ct' not in u and 'cent' not in u %}{{ v * 100 }}
        {% else %}{{ v }}{% endif %}

      # --- Messwerte in W (kW-Sensoren werden umgerechnet) ------------------
      netz_power: >
        {% set e = grid_power_entity %}
        {% set k = 1000 if (state_attr(e, 'unit_of_measurement') or '') | lower == 'kw' else 1 %}
        {{ states(e) | float(0) * k }}
      akku_power: >
        {% set ns = namespace(s=0) %}
        {% for b in batterien if b.get('live') %}
          {% set k = 1000 if (state_attr(b.live, 'unit_of_measurement') or '') | lower == 'kw' else 1 %}
          {% set ns.s = ns.s + states(b.live) | float(0) * k %}
        {% endfor %}
        {{ ns.s }}
      batt_soc: "{{ states(batt_soc_entity) | float(0) if has_battery else 0 }}"
      # Wie lange (s) ein Messwert schon fehlt – 0 = alles da. Netz und
      # Akku-Leistung gelten für alle Wallboxen, der Akku-Ladestand für die
      # Freigabe.
      mess_weg_s: >
        {% set ns = namespace(s=0) %}
        {% set ids = [grid_power_entity] + batterien | map(attribute='live') | select('string') | list %}
        {% for e in ids | select | list if not states(e) | is_number %}
          {% set x = expand(e) | first %}
          {% set ns.s = [ns.s, (now() - x.last_changed).total_seconds() if x is defined else 9999] | max %}
        {% endfor %}
        {{ ns.s | int }}
      soc_weg_s: >
        {% set e = batt_soc_entity %}
        {% if not (has_battery and e) or states(e) | is_number %}0
        {% else %}{% set x = expand(e) | first %}{{ ((now() - x.last_changed).total_seconds() if x is defined else 9999) | int }}{% endif %}
      # Was der Hausakku höchstens zum Laden beisteuert: 10 % unter seiner
      # höchsten Entladeleistung (Zuordnung → Hausbatterie → Hardware &
      # Grenzen). Dort steht die Leistung in W oder eine Zahl-Entität, deren
      # Obergrenze gilt (Sungrow: number.battery_max_discharge_power). Ohne
      # Angabe 0 – der Akku wird dann nur nicht gesperrt.
      battery_max_discharge_w: >
        {% set ns = namespace(s=0) %}
        {% for b in batterien %}
          {% set m = b.get('more') or {} %}
          {% set w = m.get('max_discharge_value') | float(0) %}
          {% if w <= 0 and m.get('max_discharge') is string %}
            {% set w = state_attr(m.max_discharge, 'max') | float(0) %}
            {% if (state_attr(m.max_discharge, 'unit_of_measurement') or '') | lower == 'kw' %}{% set w = w * 1000 %}{% endif %}
          {% endif %}
          {% set ns.s = ns.s + w %}
        {% endfor %}
        {{ (ns.s * 0.9 / 100) | int * 100 }}

      # Welcher Akku-Modus zuletzt aktiviert wurde (Szene: Zeitstempel,
      # Skript: last_triggered, Schalter: an seit)
      akku_aktuell: >
        {% set ns = namespace(best='', t=as_datetime('1970-01-01T00:00:00+00:00')) %}
        {% for e in [batt_normal_mode, batt_stop_discharging, batt_force_charge] if e %}
          {% set d = e.split('.')[0] %}
          {% if d == 'scene' %}{% set t = as_datetime(states(e), none) %}
          {% elif d == 'script' %}{% set t = state_attr(e, 'last_triggered') %}
          {% elif is_state(e, 'on') %}{% set t = (expand(e) | first).last_changed %}
          {% else %}{% set t = none %}{% endif %}
          {% if t is not none and t > ns.t %}{% set ns.best = e %}{% set ns.t = t %}{% endif %}
        {% endfor %}
        {{ ns.best }}

      # --- Wallboxen: Zuordnung, Grenzen und Messwerte je Wallbox ----------
      boxen: >
        {% set ns = namespace(l=[]) %}
        {% for wb in cfg.get('wallboxes') or [] if wb is mapping %}
          {% set more = wb.get('more') or {} %}
          {% set c = wb.get('control') or {} %}
          {% set mode_e = wb.get('charge_type') or '' %}
          {% set power_e = wb.get('send_power') or '' %}
          {% set act_e = wb.get('activate_station') or '' %}
          {% set live = wb.get('live') or '' %}
          {% set live_e = (live.get('entity') or '') if live is mapping else live %}
          {# Direkte Steuerung der Wallbox (optional) #}
          {% set cur_e = c.get('current_set') or '' %}
          {% set stop_e = c.get('charge_stop') or '' %}
          {% set stop_opt = c.get('stop_option') | string if c.get('stop_option') is not none else '' %}
          {% set start_opt = c.get('start_option') | string if c.get('start_option') is not none else '' %}
          {% set phase_e = c.get('phase_switch') or '' %}
          {% set ph1 = c.get('phase1_option') | string if c.get('phase1_option') is not none else '' %}
          {% set ph3 = c.get('phase3_option') | string if c.get('phase3_option') is not none else '' %}

          {# Leistungsgrenzen #}
          {% set phases = (more.get('phases_value') or 3) | int %}
          {% set max_w = (more.get('max_power_value') or 11000) | int %}
          {% set min_a = (more.get('min_current_value') or 6) | int %}
          {# Wallbox kann zwischen 1 und 3 Phasen umschalten? #}
          {% set kann_1ph = phase_e != '' and ph1 != '' and ph3 != '' and phases > 1
                            and states(phase_e) not in ['unknown', 'unavailable'] %}
          {# Kleinste Ladeleistung: Mindeststrom je Phase – mit Umschaltung
             1-phasig. Auf volle 100 W aufgerundet (Schrittweite des Helfers). #}
          {% set min_w = ((min_a * 230 * (1 if kann_1ph else phases) / 100) | round(0, 'ceil') * 100) | int %}
          {% set a = (max_w / (230 * phases)) | round(0) | int %}
          {% set a_max = [a, state_attr(cur_e, 'max') | int(a)] | min if cur_e else a %}

          {# Einstellungen: "Solar + günstig" ist bei günstigem Strom wie
             Schnell, sonst wie Solar #}
          {% set modus = states(mode_e) if mode_e else 'Aus' %}
          {% set modus_eff = ('Schnell' if preis < grenze else 'Solar') if modus == 'Solar + günstig' else modus %}
          {# Ladeziel-Helfer ist 0.0–1.0, eigene Entitäten oft 0–100 #}
          {% set v = states(wb.get('charge_percent_limit') or '') | float(1) %}
          {% set ziel_soc = v * 100 if v <= 1 else v %}
          {% set car_soc = states(wb.get('car_percent') or '') | float(-1) %}
          {% set fertig = not is_state(wb.get('ignore_percent_limit') or '', 'on') and car_soc >= 0 and car_soc >= ziel_soc %}

          {# Messwerte #}
          {% set k = 1000 if (state_attr(live_e, 'unit_of_measurement') or '') | lower == 'kw' else 1 %}
          {% set laedt = states(act_e) | float(0) > 0 %}
          {% set ueberbrueckt = states(act_e) | float(0) == 2 %}
          {# Ladeleistung kurz weg: so tun, als zöge sie die Soll-Leistung #}
          {% if live_e == '' or states(live_e) | is_number %}
            {% set power = states(live_e) | float(0) * k %}{% set weg_s = 0 %}
          {% else %}
            {% set x = expand(live_e) | first %}
            {% set weg_s = ((now() - x.last_changed).total_seconds() if x is defined else 9999) | int %}
            {% set power = states(power_e) | float(0) if laedt else 0 %}
          {% endif %}
          {% set seit = (now() - (expand(act_e) | first).last_changed).total_seconds() | int
                        if act_e and expand(act_e) | count > 0 else 0 %}
          {# Pausiert? Auswahl: steht auf der Pause-Option; Schalter: aus #}
          {% if stop_e == '' %}{% set pausiert = false %}
          {% elif stop_e.split('.')[0] in ['select', 'input_select'] %}{% set pausiert = states(stop_e) == stop_opt %}
          {% else %}{% set pausiert = is_state(stop_e, 'off') %}{% endif %}

          {% set ns.l = ns.l + [{
            'name': wb.get('name') or 'Wallbox ' ~ loop.index,
            'ok': mode_e != '' and power_e != '' and act_e != '',
            'power_e': power_e, 'act_e': act_e,
            'modus': modus, 'modus_eff': modus_eff, 'fertig': fertig,
            'power': power, 'weg_s': weg_s, 'laedt': laedt, 'ueberbrueckt': ueberbrueckt, 'seit': seit,
            'phases': phases, 'max_w': max_w, 'min_a': min_a, 'min_w': min_w,
            'min_3ph_w': min_a * 230 * phases, 'a_max': a_max,
            'kann_1ph': kann_1ph,
            'ph_akt': 1 if kann_1ph and states(phase_e) == ph1 else phases,
            'direkt': cur_e != '' and states(cur_e) not in ['unknown', 'unavailable'],
            'cur_e': cur_e, 'stop_e': stop_e, 'stop_opt': stop_opt, 'start_opt': start_opt,
            'phase_e': phase_e, 'ph1': ph1, 'ph3': ph3,
            'pausiert': pausiert,
            'pause_ueber_strom': stop_e == '' and state_attr(cur_e, 'min') | float(0) <= 0,
          }] %}
        {% endfor %}
        {{ ns.l }}

      # --- Solarüberschuss für die Wallboxen --------------------------------
      # Was gerade eingespeist wird plus was die Wallboxen schon ziehen – ohne
      # die, die gerade schnell laden (deren Bezug ist kein Überschuss).
      # Entlädt der Akku, ist das kein Überschuss – außer mit Freigabe
      # (dann darf er bis zur Reserve bis zu battery_max_discharge_w beisteuern).
      # Bei "Auto zuerst" zählt auch, was gerade in den Akku geht.
      # Ladestand kurz weg: wie bisher (Akku war nicht gesperrt); länger weg: nein
      akku_abgabe_moeglich: >
        {% if not (has_battery and freigabe) %}{{ false }}
        {% elif soc_weg_s == 0 %}{{ batt_soc > reserve + 3 }}
        {% elif soc_weg_s <= 30 %}{{ akku_aktuell != batt_stop_discharging or batt_stop_discharging == '' }}
        {% else %}{{ false }}{% endif %}
      ueberschuss_w: >
        {% if mess_weg_s > 0 %}
          {# Netz oder Akku kurz weg: genau so viel, wie gerade verteilt ist #}
          {% set ns = namespace(s=0) %}
          {% for b in boxen if b.ok and b.laedt and b.modus_eff != 'Schnell' %}
            {% set ns.s = ns.s + states(b.power_e) | float(0) %}
          {% endfor %}
          {{ ns.s }}
        {% else %}
        {% set ns = namespace(s=0) %}
        {% for b in boxen if b.ok and not (b.modus_eff == 'Schnell' and not b.fertig) %}
          {% set ns.s = ns.s + b.power %}
        {% endfor %}
        {% set s = ns.s - netz_power - [akku_power, 0] | max %}
        {% if has_battery and prio == 'Auto zuerst' %}{% set s = s + [-akku_power, 0] | max %}{% endif %}
        {% if akku_abgabe_moeglich %}{% set s = s + battery_max_discharge_w %}{% endif %}
        {{ [s, 0] | max }}
        {% endif %}

      # --- Zielwerte je Wallbox ---------------------------------------------
      # w = Soll-Leistung, aktiv = 1 (lädt) / 2 (überbrückt) / 0, phasen_ziel
      # und ampere für die direkte Steuerung, grund = warum gestoppt.
      plan: >
        {% set ns = namespace(l=[], rest=ueberschuss_w | float(0)) %}
        {% for b in boxen %}
          {% set aktiv = none %}{% set grund = '' %}
          {% if not b.ok or b.fertig or b.modus_eff in ['Aus', 'unknown', 'unavailable'] %}{% set w = 0 %}
          {% elif b.modus_eff == 'Schnell' %}{% set w = b.max_w %}
          {% elif b.weg_s > 30 %}{% set w = 0 %}{% set grund = 'Ladeleistung fehlt' %}
          {% elif mess_weg_s > 30 %}{% set w = 0 %}{% set grund = 'Netz-/Akku-Messwert fehlt' %}
          {% else %}
            {# Hysterese: läuft die Wallbox schon, erst 500 W unter der Mindestleistung stoppen #}
            {% set schwelle = b.min_w - 500 if b.laedt else b.min_w %}
            {% if ns.rest >= schwelle %}
              {% set w = ([[ns.rest, b.min_w] | max, b.max_w] | min / 100) | int * 100 %}
              {# Was die Wallbox nach 2 min nicht abnimmt, bleibt für die nächste #}
              {% set nimmt = [w, b.power + 500] | min if b.laedt and b.seit > 120 else w %}
              {% set ns.rest = [ns.rest - nimmt, 0] | max %}
            {% elif b.laedt and not (b.ueberbrueckt and b.seit >= 60) %}
              {# Wolke: bis 1 min mit Mindestleistung weiter, der Akku überbrückt #}
              {% set w = b.min_w %}{% set aktiv = 2 %}
              {% set ns.rest = 0 %}
            {% else %}
              {% set w = 0 %}{% set grund = 'Überschuss reicht nicht' if b.laedt else '' %}
            {% endif %}
          {% endif %}
          {% set aktiv = aktiv if aktiv is not none else (1 if w > 0 else 0) %}
          {# Phasen mit Hysterese, damit nicht ständig umgeschaltet wird
             (Schütz im Auto): auf 3 Phasen erst 200 W über, zurück auf 1 erst
             300 W unter der 3-phasigen Mindestleistung. #}
          {% if not b.kann_1ph %}{% set ph = b.phases %}
          {% elif w == 0 %}{% set ph = b.ph_akt %}
          {% elif b.ph_akt == 1 %}{% set ph = b.phases if w >= b.min_3ph_w + 200 else 1 %}
          {% else %}{% set ph = 1 if w < b.min_3ph_w - 300 else b.phases %}{% endif %}
          {% if w == 0 %}{% set a = 0 %}
          {# volle Leistung = Höchststrom (11000 W / 690 wären abgerundet nur 15 A) #}
          {% elif w >= b.max_w %}{% set a = b.a_max %}
          {% else %}{% set a = [[(w / (230 * ph)) | round(0, 'floor') | int, b.min_a] | max, b.a_max] | min %}{% endif %}
          {% set ns.l = ns.l + [dict(b, w=w, aktiv=aktiv, phasen_ziel=ph, ampere=a, grund=grund)] %}
        {% endfor %}
        {{ ns.l }}

      # Akku: Netzladen bei schlechter Prognose + günstigem Strom (nur mit Schalter)
      prognose_kwh: >
        {% set ns = namespace(s=0) %}
        {% for p in cfg.get('solar') or [] %}
          {% set f = p.get('forecast') %}
          {% set e = f if f is string else (f | first if f else none) %}
          {% if e is string %}{% set ns.s = ns.s + states(e) | float(0) %}{% endif %}
        {% endfor %}
        {{ ns.s }}
      tagesverbrauch_kwh: >
        {% set e = (cfg.get('systemdata') or {}).get('house_base_load') %}
        {{ (states(e) | float(0) * 24 / 1000) if e else 10 }}
      akku_netzladen: "{{ netzladen_erlaubt and preis < grenze and prognose_kwh < tagesverbrauch_kwh and batt_soc < 80 }}"
      # Das Auto soll den Hausakku nicht leeren – außer mit Freigabe über der
      # Reserve. Gilt in jedem Lademodus und für jede Wallbox, denn auch beim
      # Solarladen zieht der Wechselrichter sonst aus dem Akku, sobald eine
      # Wolke kommt.
      wallbox_laedt: "{{ plan | selectattr('ok') | selectattr('laedt') | list | count > 0 or plan | selectattr('aktiv', 'gt', 0) | list | count > 0 }}"
      # Überbrückt eine Wallbox gerade eine Wolke, darf der Akku einspringen
      ueberbrueckung: "{{ plan | selectattr('aktiv', 'eq', 2) | list | count > 0 }}"
      akku_sperren: "{{ wallbox_laedt and not akku_abgabe_moeglich and not ueberbrueckung }}"
      akku_ziel: >
        {% if not (has_battery and can_control_battery) %}{{ '' }}
        {% elif akku_netzladen and batt_force_charge %}{{ batt_force_charge }}
        {% elif akku_sperren and batt_stop_discharging %}{{ batt_stop_discharging }}
        {% else %}{{ batt_normal_mode }}{% endif %}
    actions:
      - choose:
          # ---------------------------------------------------------------
          # A. "Nur lesen" eben eingeschaltet: einmal alles freigeben
          # ---------------------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ freigeben }}"
            sequence:
              - repeat:
                  for_each: "{{ boxen }}"
                  sequence:
                    - variables:
                        b: "{{ repeat.item }}"
                    # Helfer: volle Leistung, freigeschaltet
                    - if:
                        - condition: template
                          value_template: "{{ b.ok and states(b.power_e) | float(-1) != b.max_w | float }}"
                      then:
                        - action: number.set_value
                          continue_on_error: true
                          target: { entity_id: "{{ b.power_e }}" }
                          data: { value: "{{ b.max_w }}" }
                    - if:
                        - condition: template
                          value_template: "{{ b.ok and states(b.act_e) | float(-1) != 1 }}"
                      then:
                        - action: number.set_value
                          continue_on_error: true
                          target: { entity_id: "{{ b.act_e }}" }
                          data: { value: 1 }
                    # Gerät: 3-phasig, Höchststrom, Laden erlaubt
                    - if:
                        - condition: template
                          value_template: "{{ b.direkt and b.kann_1ph and b.ph_akt | int == 1 }}"
                      then:
                        - action: "{{ b.phase_e.split('.')[0] }}.select_option"
                          continue_on_error: true
                          target: { entity_id: "{{ b.phase_e }}" }
                          data: { option: "{{ b.ph3 | string }}" }
                    - if:
                        - condition: template
                          value_template: "{{ b.direkt and states(b.cur_e) | float(-1) != b.a_max | float }}"
                      then:
                        - action: "{{ b.cur_e.split('.')[0] }}.set_value"
                          continue_on_error: true
                          target: { entity_id: "{{ b.cur_e }}" }
                          data: { value: "{{ b.a_max }}" }
                    - if:
                        - condition: template
                          value_template: "{{ b.direkt and b.stop_e != '' and b.pausiert }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ b.stop_e.split('.')[0] in ['select', 'input_select'] }}"
                          then:
                            - action: "{{ b.stop_e.split('.')[0] }}.select_option"
                              continue_on_error: true
                              target: { entity_id: "{{ b.stop_e }}" }
                              data: { option: "{{ b.start_opt | string }}" }
                          else:
                            - action: homeassistant.turn_on
                              continue_on_error: true
                              target: { entity_id: "{{ b.stop_e }}" }
              # Hausakku zurück in den Normalbetrieb
              - if:
                  - condition: template
                    value_template: "{{ has_battery and can_control_battery and akku_aktuell != batt_normal_mode }}"
                then:
                  - action: homeassistant.turn_on
                    continue_on_error: true
                    target: { entity_id: "{{ batt_normal_mode }}" }

          # ---------------------------------------------------------------
          # B. "Nur lesen" an: nichts schreiben
          # ---------------------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ read_only }}"
            sequence: []

        # -----------------------------------------------------------------
        # C. Regeln
        # -----------------------------------------------------------------
        default:
          # ---------------------------------------------------------------
          # 1. WALLBOXEN (nur schreiben, wenn sich etwas ändert). Schlägt ein
          #    Schreibvorgang fehl, geht es mit dem nächsten weiter – eine
          #    nicht erreichbare Wallbox hält weder die anderen noch den
          #    Akku auf.
          # ---------------------------------------------------------------
          - repeat:
              for_each: "{{ plan | selectattr('ok') | list }}"
              sequence:
                - variables:
                    b: "{{ repeat.item }}"
                # Beim Abschalten erst freigeben=0, dann Leistung; beim Einschalten umgekehrt
                - if:
                    - condition: template
                      value_template: "{{ b.aktiv == 0 and states(b.act_e) | float(-1) != 0 }}"
                  then:
                    - action: number.set_value
                      continue_on_error: true
                      target: { entity_id: "{{ b.act_e }}" }
                      data: { value: 0 }
                - if:
                    - condition: template
                      value_template: "{{ states(b.power_e) | float(-1) != b.w | float }}"
                  then:
                    - action: number.set_value
                      continue_on_error: true
                      target: { entity_id: "{{ b.power_e }}" }
                      data: { value: "{{ b.w }}" }
                - if:
                    - condition: template
                      value_template: "{{ b.aktiv > 0 and states(b.act_e) | float(-1) != b.aktiv }}"
                  then:
                    - action: number.set_value
                      continue_on_error: true
                      target: { entity_id: "{{ b.act_e }}" }
                      data: { value: "{{ b.aktiv }}" }

                # -----------------------------------------------------------
                # 1b. Direkte Steuerung (Ladestrom-Vorgabe in A, Pause, Phasen)
                # -----------------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ b.direkt }}"
                  then:
                    - choose:
                        # Pause
                        - conditions:
                            - condition: template
                              value_template: "{{ b.aktiv == 0 }}"
                          sequence:
                            - if:
                                - condition: template
                                  value_template: "{{ b.stop_e != '' and (not b.pausiert or auffrischen) }}"
                              then:
                                - if:
                                    - condition: template
                                      value_template: "{{ b.stop_e.split('.')[0] in ['select', 'input_select'] }}"
                                  then:
                                    - action: "{{ b.stop_e.split('.')[0] }}.select_option"
                                      continue_on_error: true
                                      target: { entity_id: "{{ b.stop_e }}" }
                                      data: { option: "{{ b.stop_opt | string }}" }
                                  else:
                                    - action: homeassistant.turn_off
                                      continue_on_error: true
                                      target: { entity_id: "{{ b.stop_e }}" }
                            - if:
                                - condition: template
                                  value_template: "{{ b.pause_ueber_strom and (states(b.cur_e) | float(-1) != 0 or auffrischen) }}"
                              then:
                                - action: "{{ b.cur_e.split('.')[0] }}.set_value"
                                  continue_on_error: true
                                  target: { entity_id: "{{ b.cur_e }}" }
                                  data: { value: 0 }
                      # Laden: erst Phasen, dann Strom, zuletzt freigeben
                      default:
                        - if:
                            - condition: template
                              value_template: "{{ b.kann_1ph and b.phasen_ziel | int != b.ph_akt | int }}"
                          then:
                            - action: "{{ b.phase_e.split('.')[0] }}.select_option"
                              continue_on_error: true
                              target: { entity_id: "{{ b.phase_e }}" }
                              data: { option: "{{ (b.ph1 if b.phasen_ziel | int == 1 else b.ph3) | string }}" }
                        - if:
                            - condition: template
                              value_template: "{{ states(b.cur_e) | float(-1) != b.ampere | float or auffrischen }}"
                          then:
                            - action: "{{ b.cur_e.split('.')[0] }}.set_value"
                              continue_on_error: true
                              target: { entity_id: "{{ b.cur_e }}" }
                              data: { value: "{{ b.ampere }}" }
                        - if:
                            - condition: template
                              value_template: "{{ b.stop_e != '' and (b.pausiert or auffrischen) }}"
                          then:
                            - if:
                                - condition: template
                                  value_template: "{{ b.stop_e.split('.')[0] in ['select', 'input_select'] }}"
                              then:
                                - action: "{{ b.stop_e.split('.')[0] }}.select_option"
                                  continue_on_error: true
                                  target: { entity_id: "{{ b.stop_e }}" }
                                  data: { option: "{{ b.start_opt | string }}" }
                              else:
                                - action: homeassistant.turn_on
                                  continue_on_error: true
                                  target: { entity_id: "{{ b.stop_e }}" }

          # ---------------------------------------------------------------
          # 2. HAUSAKKU (Szene/Skript/Schalter bei Wechsel und beim Auffrischen)
          # ---------------------------------------------------------------
          - if:
              - condition: template
                value_template: "{{ akku_ziel != '' and (akku_ziel != akku_aktuell or auffrischen) }}"
            then:
              - action: homeassistant.turn_on
                continue_on_error: true
                target: { entity_id: "{{ akku_ziel }}" }
