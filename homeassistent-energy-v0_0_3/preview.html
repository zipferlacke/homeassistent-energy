<style>
  /* Nachbau der Home-Assistant-Umgebung. Genau die Variablen, die die
     Karten lesen – mehr braucht es nicht, um das Layout zu beurteilen. */
  :root {
    color-scheme: light;
    --primary-color: #03a9f4;
    --text-primary-color: #fff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --card-background-color: #fff;
    --secondary-background-color: #e5e5e5;
    --divider-color: rgba(0,0,0,.12);
    --error-color: #db4437;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: 0 2px 6px rgba(0,0,0,.12);
    --energy-solar-color: #ff9800;
    --energy-grid-consumption-color: #488fc2;
    --energy-grid-return-color: #8353d1;
    --energy-battery-in-color: #f6c34c;
    --energy-battery-out-color: #4db0a2;
    --app-bg: #f2f4f6;
  }
  html.dark {
    color-scheme: dark;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1c;
    --secondary-background-color: #2c2c2c;
    --divider-color: rgba(255,255,255,.12);
    --app-bg: #111213;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--app-bg);
    color: var(--primary-text-color);
    font-family: Roboto, "Helvetica Neue", system-ui, sans-serif;
    margin: 0;
    padding: 0 0 4rem;
  }

  .bar {
    align-items: center;
    background: var(--card-background-color);
    border-bottom: 1px solid var(--divider-color);
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    padding: .6rem 1rem;
    position: sticky;
    top: 0;
    z-index: 10;

    & strong { margin-right: auto; }
    & button {
      background: var(--secondary-background-color);
      border: 0; border-radius: 999px; color: inherit; cursor: pointer;
      font: inherit; font-size: .85rem; padding: .35rem .9rem;
    }
    & button.on { background: var(--primary-color); color: var(--text-primary-color); }
  }

  .views { display: grid; gap: 1.5rem; padding: 1.25rem; }
  .view > h2 {
    color: var(--secondary-text-color);
    font-size: .8rem; font-weight: 600; letter-spacing: .08em;
    margin: 0 0 .6rem; text-transform: uppercase;
  }
  .view { margin-inline: auto; width: 100%; }
  .grid { display: grid; gap: 1rem; }

  /* Breite wie eine HA-Sections-Spalte, damit die Beurteilung stimmt. */
  body[data-width="narrow"] .view { max-width: 420px; }
  body[data-width="column"] .view { max-width: 620px; }
  body[data-width="wide"] .view { max-width: 1100px; }
  body[data-width="wide"] .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .note {
    background: var(--card-background-color);
    border-left: 3px solid var(--primary-color);
    border-radius: 6px;
    color: var(--secondary-text-color);
    font-size: .82rem;
    margin: 0 1.25rem;
    padding: .6rem .8rem;
  }
</style>
</head>

  'sensor.house_energy_today':   PV_CURVE.map((_, h) => .35 + (h > 6 && h < 9 ? .6 : 0) + (h > 17 && h < 22 ? .9 : 0)),
  'sensor.wallbox_energy':       [],
  'sensor.wallbox_today':        PV_CURVE.map((_, h) => (h >= 11 && h <= 15 ? 2.6 : 0)),
  'sensor.heatpump_energy_today':PV_CURVE.map((_, h) => (h < 8 || h > 19 ? .8 : .25)),

function statistics(ids) {
  const out = {};
  const hours = Math.max(1, now.getHours() + 1);
  for (const id of ids) {
    if (id === 'sensor.battery_soc') {
      out[id] = Array.from({ length: hours }, (_, h) => ({
        start: new Date(now.getFullYear(), now.getMonth(), now.getDate(), h).getTime(),
        mean: Math.max(8, Math.min(98, 22 + PV_CURVE.slice(0, h + 1).reduce((a, v) => a + v * 3.1, 0) - h * 1.6)),
      }));
      continue;
    }
    const shape = SHAPE[id];
    if (!shape || !shape.length) continue;
    out[id] = Array.from({ length: hours }, (_, h) => ({
      start: new Date(now.getFullYear(), now.getMonth(), now.getDate(), h).getTime(),
      change: Number(shape[h].toFixed(3)),
    }));
  }
  return out;
}

/**
 * Stilblatt an ein Shadow Root hängen. Tokens und Grundgerüst kommen

 */
const SHEETS = new Map();

function sheet(key, cssText) {
  if (!SHEETS.has(key)) {
    const s = new CSSStyleSheet();
    s.replaceSync(cssText);
    SHEETS.set(key, s);
  }
  return SHEETS.get(key);
}

function adoptSheet(root, cssText, key) {
  root.adoptedStyleSheets = [
    sheet('tokens', TOKENS_CSS),
    sheet('base', BASE_CSS),
    sheet(key, cssText),
  ];
}

/* ------------------------------------------------------------------ *
 * Zustände lesen
 * ------------------------------------------------------------------ */

/** Nimmt einen String, eine Liste oder undefined und liefert immer eine Liste. */
function asList(value) {
  if (!value) return [];
  return Array.isArray(value) ? value.filter(Boolean) : [value];
}

const ENTITY_ID = /^[a-z_]+\.[a-z0-9_]+$/;

/**
 * Sammelt alle Entitäts-IDs, die irgendwo in einer Konfiguration stehen —
 * auch tief in Listen und Unterobjekten wie den Wallbox-Blöcken.
 * Damit weiß eine Karte, welche Zustandsänderungen sie überhaupt angehen.
 */
function entityIds(config) {
  const out = new Set();
  const walk = (v) => {
    if (typeof v === 'string') {
      if (ENTITY_ID.test(v)) out.add(v);
    } else if (Array.isArray(v)) {
      v.forEach(walk);
    } else if (v && typeof v === 'object') {
      Object.values(v).forEach(walk);
    }
  };
  walk(config);
  return [...out];
}

/**
 * Hat sich an den genannten Entitäten etwas getan? Home Assistant tauscht
 * das Zustandsobjekt bei jeder Änderung aus, ein Vergleich der Referenz
 * genügt also.
 */
function statesChanged(prev, next, ids) {
  if (!prev) return true;
  for (const id of ids) {
    if (prev.states?.[id] !== next.states?.[id]) return true;
  }
  return false;
}

function num(hass, entityId, { invert = false } = {}) {
  if (!hass || !entityId) return null;
  const v = Number(hass.states[entityId]?.state);
  return Number.isFinite(v) ? v * (invert ? -1 : 1) : null;
}

function unitOf(hass, entityId) {
  return (hass?.states?.[entityId]?.attributes?.unit_of_measurement ?? '').toLowerCase();
}

/** Leistung in Watt, egal ob der Sensor W, kW oder MW liefert. */
function power(hass, entityId, opts = {}) {
  const v = num(hass, entityId, opts);
  if (v === null) return null;
  const u = unitOf(hass, entityId);
  return u === 'kw' ? v * 1000 : u === 'mw' ? v * 1e6 : v;
}

/** Energie in kWh, egal ob der Sensor Wh, kWh oder MWh liefert. */
function energy(hass, entityId, opts = {}) {
  const v = num(hass, entityId, opts);
  if (v === null) return null;
  const u = unitOf(hass, entityId);
  return u === 'wh' ? v / 1000 : u === 'mwh' ? v * 1000 : v;
}

/** Summe über eine Liste von Entitäten. Leere Liste ergibt null. */
function sum(hass, ids, fn = power, opts = {}) {
  const list = asList(ids);
  if (!list.length) return null;
  let total = 0;
  let any = false;
  for (const id of list) {
    const v = fn(hass, id, opts);
    if (v !== null) {
      total += v;
      any = true;
    }
  }
  return any ? total : null;
}

/** Einzelwerte mit Namen – für Aufschlüsselungen wie PV-Stränge. */
function breakdown(hass, ids, fn = power, opts = {}) {
  return asList(ids)
    .map((id) => ({
      id,
      name: hass?.states?.[id]?.attributes?.friendly_name ?? id,
      value: fn(hass, id, opts),
    }))
    .filter((e) => e.value !== null);
}

/* ------------------------------------------------------------------ *
 * Formatierung
 * ------------------------------------------------------------------ */

/** Fremde Zeichenketten absichern, bevor sie in innerHTML landen. */
function esc(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]),
  );
}

const de = (v, d) =>
  new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);

function fmtPower(watt) {
  if (watt === null || watt === undefined) return '–';
  const a = Math.abs(watt);
  return a >= 1000 ? `${de(watt / 1000, a >= 10000 ? 1 : 2)} kW` : `${de(Math.round(watt), 0)} W`;
}

function fmtEnergy(kwh) {
  if (kwh === null || kwh === undefined) return '–';
  const a = Math.abs(kwh);
  if (a >= 1000) return `${de(kwh / 1000, 2)} MWh`;
  if (a >= 100) return `${de(kwh, 0)} kWh`;
  if (a >= 10) return `${de(kwh, 1)} kWh`;
  return `${de(kwh, 2)} kWh`;
}

function fmtPercent(v, d = 0) {
  return v === null || v === undefined ? '–' : `${de(v, d)} %`;
}

function fmtSigned(kwh) {
  if (kwh === null || kwh === undefined) return '–';
  return `${kwh < 0 ? '−' : '+'} ${fmtEnergy(Math.abs(kwh))}`;
}

function fmtPrice(ct) {
  return ct === null || ct === undefined ? '–' : `${de(ct, 1)} ct`;
}

function fmtClock(date) {
  return new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' }).format(date);
}

/** Geldwert in Euro, mit Vorzeichen. */
function fmtEuro(value, { signed = true } = {}) {
  if (value === null || value === undefined) return '–';
  const s = de(Math.abs(value), 2);
  return signed ? `${value < 0 ? '−' : '+'} ${s} €` : `${s} €`;
}

/** Restdauer als "2 h 10 min". */
function fmtDuration(hours) {
  const total = Math.round(hours * 60);
  if (total < 1) return 'gleich';
  const h = Math.floor(total / 60);
  const m = total % 60;
  return h ? `${h} h ${m} min` : `${m} min`;
}

/* ------------------------------------------------------------------ *
 * Strompreis
 * ------------------------------------------------------------------ */

/**
 * Liefert { now, unit, forecast } in ct/kWh.
 * Der Sensor darf einen festen Wert liefern oder eine Liste im Attribut.
 * Fehlt der Sensor, greift der Festpreis aus der Config.
 */
function priceInfo(hass, config, direction = 'import') {
  const entity = direction === 'import' ? config.price_entity : config.price_export_entity;
  const fixed = direction === 'import' ? config.price_import_fixed : config.price_export_fixed;
  const st = entity ? hass?.states?.[entity] : null;

  if (!st) return { now: fixed ?? null, unit: 'ct/kWh', forecast: [], fixed: true };

  let now = Number(st.state);
  const unit = st.attributes.unit_of_measurement ?? 'ct/kWh';
  // €/kWh-Sensoren auf ct umrechnen, damit die Achse lesbar bleibt
  const toCt = /€|eur/i.test(unit) && !/ct|cent/i.test(unit) ? 100 : 1;
  if (Number.isFinite(now)) now *= toCt;
  else now = fixed ?? null;

  const attr = config.price_forecast_attribute ?? 'prices';
  const raw = st.attributes[attr] ?? st.attributes.forecast ?? st.attributes.data ?? [];
  const forecast = (Array.isArray(raw) ? raw : [])
    .map((e) => {
      const t = e.start_time ?? e.startsAt ?? e.start ?? e.time ?? e.datetime;
      const v = e.price ?? e.total ?? e.value ?? e.marketprice;
      return t && Number.isFinite(Number(v)) ? { time: new Date(t), value: Number(v) * toCt } : null;
    })
    .filter(Boolean);

  return { now, unit: 'ct/kWh', forecast, fixed: false };
}

const sel = {

  bool: () => ({ boolean: {} }),

  entities: (domain = 'sensor') => ({ entity: { filter: { domain }, multiple: true } }),

};

/* ------------------------------------------------------------------ *
 * Zentrale Zuordnung aus der Integration
 * ------------------------------------------------------------------ */

let centralPromise = null;
let centralSubscribed = false;

/**
 * Holt die auf der Seite "wuefl Energie" gepflegte Zuordnung.
 * Fehlt die Integration, kommt ein leeres Objekt zurück und die Karten
 * arbeiten allein mit ihrer eigenen Konfiguration weiter.
 */
async function centralConfig(hass, section) {
  if (!hass) return {};

  if (!centralPromise) {
    centralPromise = hass.callWS({ type: 'wuefl_energy/get' }).catch(() => {
      // Fehlschläge nicht dauerhaft merken – sonst bliebe eine noch
      // startende Integration bis zum Seitenwechsel "leer".
      centralPromise = null;
      return {};
    });
  }
  const all = (await centralPromise) ?? {};

  if (!centralSubscribed && hass.connection) {
    centralSubscribed = true;
    hass.connection
      .subscribeEvents(() => {
        centralPromise = null;
        window.dispatchEvent(new CustomEvent('wuefl-energy-config-changed'));
      }, 'wuefl_energy_updated')
      .catch(() => {
        centralSubscribed = false;
      });
  }

  return (section ? all[section] : all) ?? {};
}

/**
 * Mischt zentrale Zuordnung und Kartenkonfiguration.
 * Was in der Karte steht, gewinnt – sonst wäre die Karte nicht mehr
 * einzeln anpassbar.
 */
function mergeConfig(central, own) {
  const out = { ...(central ?? {}) };
  for (const [k, v] of Object.entries(own ?? {})) {
    if (v !== undefined && v !== null && v !== '') out[k] = v;
  }
  return out;
}

/** Kleines Flächendiagramm für Preis- und Prognosestreifen. */
function sparkline(points, color, { width = 300, height = 78, pad = 5 } = {}) {
  if (!points.length) return '';
  const max = Math.max(...points);
  const min = Math.min(0, ...points);
  const span = max - min || 1;
  const x = (i) =>
    pad + (points.length < 2 ? width / 2 : (i / (points.length - 1)) * (width - 2 * pad));
  const y = (v) => height - pad - ((v - min) / span) * (height - 2 * pad);
  const line = points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const id = `sg${Math.random().toString(36).slice(2, 8)}`;
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" class="spark">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: ${color}; stop-opacity: .45"/>
      <stop offset="1" style="stop-color: ${color}; stop-opacity: 0"/>
    </linearGradient></defs>
    <path d="${line} L${x(points.length - 1).toFixed(1)} ${height - pad} L${pad} ${height - pad} Z" fill="url(#${id})"/>
    <path d="${line}" style="stroke: ${color}" fill="none" stroke-width="2.5"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

class WueflEnergyLiveCard extends HTMLElement {
  #own = {};
  #central = {};
  #config = {};
  #hass = null;
  #prevHass = null;
  #built = false;
  #svgReady = false;
  #els = {};
  #forecast = null;
  #watch = [];
  #watchPlot = [];
  #plotDirty = true;

  static getConfigElement() { return document.createElement('wuefl-energy-live-card-editor'); }
  static getStubConfig() { return { title: 'Zuhause', show_totals: true }; }

  setConfig(config) {
    this.#own = config ?? {};
    this.#apply();
  }

  /**
   * Home Assistant setzt hass bei *jeder* Zustandsänderung im ganzen System.
   * Ohne Filter würde die Karte mehrmals pro Sekunde komplett neu aufbauen,
   * deshalb hier der Vergleich gegen die tatsächlich benutzten Entitäten.
   */
  set hass(hass) {
    const first = !this.#hass;
    this.#prevHass = this.#hass;
    this.#hass = hass;

    if (first) {
      this.#loadCentral();
      window.addEventListener('wuefl-energy-config-changed', () => this.#loadCentral());
    }
    if (first || statesChanged(this.#prevHass, hass, this.#watch)) this.#render();
  }

  getCardSize() { return 13; }

  async #loadCentral() {
    const all = await centralConfig(this.#hass);
    this.#central = { ...(all.live ?? {}), ...(all.price ?? {}) };
    this.#central.wallboxes = [all.wallbox_1, all.wallbox_2, all.wallbox_3].filter(
      (w) => w && Object.keys(w).length,
    );
    this.#apply();
    this.#render();
    // Erst jetzt steht fest, welche Wetter-Entität gilt.
    this.#loadForecast();
  }

  #apply() {
    const merged = mergeConfig(this.#central, this.#own);
    this.#config = { title: 'Zuhause', show_totals: true, ...merged };
    this.#watch = entityIds(this.#config);
    this.#watchPlot = [
      this.#config.price_entity,
      ...asList(this.#config.pv_forecast_entities),
    ].filter(Boolean);
    this.#plotDirty = true;
    this.#built = false;
    this.#svgReady = false;
    if (this.shadowRoot) this.shadowRoot.replaceChildren();
  }

  /* ------------------------------ Aufbau ---------------------------- */

  #build() {
    const root = this.shadowRoot ?? this.attachShadow({ mode: 'open' });
    adoptSheet(root, CSS, 'live');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="head">
        <h2></h2>
        <button class="weather" type="button" hidden>
          ${icon('mdi:thermometer')}<span class="temp">–</span>
        </button>
      </div>
      <div class="scene"><div class="state">Grafik wird geladen …</div></div>
      <div class="money"></div>
      <div class="forecast" hidden>
        <div class="fhead"><span>Heute: Strompreis und PV-Prognose</span><span class="legend"></span></div>
        <div class="plot plotbox"></div>
      </div>
      <dialog class="fc">
        <header><h3>Wettervorhersage</h3>
          <button class="close" type="button" aria-label="Schließen">${icon('mdi:close')}</button>
        </header>
        <div class="fc-body"></div>
      </dialog>
    `;
    root.appendChild(card);

    this.#els = {
      card,
      title: card.querySelector('h2'),
      weather: card.querySelector('.weather'),
      wIcon: card.querySelector('.weather ha-icon'),
      wTemp: card.querySelector('.weather .temp'),
      dialog: card.querySelector('dialog.fc'),
      fcBody: card.querySelector('.fc-body'),
      scene: card.querySelector('.scene'),
      money: card.querySelector('.money'),
      forecast: card.querySelector('.forecast'),
      plot: card.querySelector('.plot'),
      legend: card.querySelector('.legend'),
    };

    this.#els.weather.addEventListener('click', () => {
      this.#renderForecast();
      this.#els.dialog.showModal();
    });
    card.querySelector('.close').addEventListener('click', () => this.#els.dialog.close());

    this.#built = true;
    this.#loadSvg();
  }

  async #loadSvg() {
    const url = this.#config.svg_url ?? SVG_URL;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status}`);
      this.#els.scene.innerHTML = await res.text();
    } catch (err) {
      this.#els.scene.innerHTML =
        `<div class="state">Die Grafik unter ${esc(url)} wurde nicht gefunden.</div>`;
      console.error('[wuefl-energy] energieflow.svg', err);
      return;
    }

    const svg = this.#els.scene.querySelector('svg');
    if (!svg) return;
    svg.removeAttribute('width');
    svg.removeAttribute('height');

    // Das SVG arbeitet mit light-dark(). Damit es dem HA-Theme folgt und
    // nicht der Systemeinstellung, wird das Farbschema hier gesetzt.
    svg.style.colorScheme = this.#hass?.themes?.darkMode ? 'dark' : 'light';

    let defs = svg.querySelector('defs');
    if (!defs) {
      defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svg.prepend(defs);
    }
    defs.insertAdjacentHTML('beforeend', SOLAR_GRADIENT);

    this.#els.svg = svg;
    this.#prepareFlows();
    this.#svgReady = true;
    this.#render();
  }

  /** Legt über jedes Kabel zwei laufende Punktlinien. */
  #prepareFlows() {
    const svg = this.#els.svg;
    this.#els.flows = {};

    for (const [key, part] of Object.entries(PARTS)) {
      if (!part.cable) continue;
      const cable = svg.querySelector(part.cable);
      if (!cable) continue;

      const thin = cable.cloneNode(false);
      const fat = cable.cloneNode(false);
      thin.removeAttribute('id');
      fat.removeAttribute('id');
      thin.setAttribute('class', 'flow');
      fat.setAttribute('class', 'flow-fat');
      for (const el of [thin, fat]) {
        el.style.opacity = '0';
        cable.parentNode.insertBefore(el, cable.nextSibling);
      }
      this.#els.flows[key] = { thin, fat };
    }
  }

  /* ------------------------------ Werte ----------------------------- */

  #wallboxes() {
    const c = this.#config;
    if (c.wallboxes?.length) return c.wallboxes;
    // Ohne zentrale Zuordnung: Leistungen aus der Liste, Namen aus HA
    return asList(c.wallbox_power).map((id, i) => ({
      power_entity: id,
      today_energy_entity: asList(c.wallbox_energy)[i],
      name: this.#hass?.states?.[id]?.attributes?.friendly_name ?? `Auto ${i + 1}`,
    }));
  }

  #present() {
    const c = this.#config;
    return {
      solar: !!c.pv_power_total || asList(c.pv_power).length > 0,
      netz: !!c.grid_power,
      batterie: asList(c.battery_power).length > 0 || asList(c.battery_soc).length > 0,
      wallbox: this.#wallboxes().length > 0,
      waermepumpe: asList(c.heatpump_power).length > 0,
      haushalt: true,
    };
  }

  #readPowers() {
    const c = this.#config;
    const h = this.#hass;
    const pv = power(h, c.pv_power_total) ?? sum(h, c.pv_power) ?? 0;
    const grid = power(h, c.grid_power, { invert: !!c.invert_grid }) ?? 0;
    const battery = sum(h, c.battery_power, power, { invert: !!c.invert_battery }) ?? 0;
    const wallbox = this.#wallboxes().reduce(
      (a, wb) => a + Math.abs(power(h, wb.power_entity) ?? 0), 0,
    );
    const heatpump = Math.abs(sum(h, c.heatpump_power) ?? 0);
    let house = power(h, c.house_power);
    if (house === null) house = pv + grid + battery - wallbox - heatpump;
    return { pv, grid, battery, wallbox, heatpump, house: Math.max(0, house) };
  }

  #render() {
    if (!this.#config) return;
    if (!this.#built) this.#build();
    if (!this.#hass) return;
    this.#els.title.textContent = this.#config.title ?? '';
    this.#renderWeather();
    this.#renderMoney();
    // Preis und Prognose ändern sich stündlich – nicht bei jedem Zustand neu bauen.
    if (this.#plotDirty || statesChanged(this.#prevHass, this.#hass, this.#watchPlot)) {
      this.#renderPlot();
      this.#plotDirty = false;
    }
    if (!this.#svgReady) return;

    const c = this.#config;
    const h = this.#hass;
    const p = this.#readPowers();
    const svg = this.#els.svg;
    const has = this.#present();
    const tot = c.show_totals;

    // Nicht konfigurierte Bereiche ausblenden
    for (const [key, part] of Object.entries(PARTS)) {
      const g = svg.querySelector(`#${part.label}`);
      if (g) g.style.display = has[key] ? '' : 'none';
    }

    const T = (selector, value) => {
      const el = svg.querySelector(selector);
      if (!el) return;
      // Der <title> im Text ist die Beschreibung – nur den Textknoten ändern
      const node = [...el.childNodes].find((n) => n.nodeType === 3);
      if (node) node.nodeValue = value;
      else el.append(value);
    };

    /* --- Solar --- */
    if (has.solar) {
      const strings = breakdown(h, c.pv_power);
      T('#label-solar-text .val', fmtPower(p.pv));
      T('#label-solar-text .cap', tot ? `(${fmtEnergy(sum(h, c.pv_energy, energy) ?? 0)})` : '');
      this.#extraLine(
        svg, '#label-solar-text', 'wuefl-strings',
        strings.length > 1
          ? `≈ ${strings.map((s) => `${this.#short(s.name)} ${fmtPower(s.value)}`).join(' · ')}`
          : '',
      );
      svg.querySelector('#solar')?.classList.toggle('is-active', p.pv >= 20);
    }

    /* --- Netz --- */
    if (has.netz) {
      const imp = sum(h, c.grid_import_energy, energy);
      const exp = sum(h, c.grid_export_energy, energy);
      T('#label-netz-text .val',
        `${p.grid >= 0 ? 'beziehen' : 'einspeisen'} ${fmtPower(Math.abs(p.grid))}`);
      // Beide Summenzeilen über die Liste ansprechen. Ein Selektor mit
      // :nth-of-type greift hier nicht, weil er die <text>-Geschwister
      // zählt und nicht die mit der Klasse .sum-out.
      const sums = svg.querySelectorAll('#label-netz-text .sum-out');
      if (sums[0]) sums[0].textContent = tot && imp !== null ? `bezogen ${fmtEnergy(imp)}` : '';
      if (sums[1]) sums[1].textContent = tot && exp !== null ? `eingespeist ${fmtEnergy(exp)}` : '';
    }

    /* --- Batterie --- */
    if (has.batterie) {
      const socs = breakdown(h, c.battery_soc, num);
      const soc = socs.length ? socs.reduce((a, s) => a + s.value, 0) / socs.length : null;
      T('#label-batterie-text .name', soc === null ? 'Batterie' : `Batterie ${fmtPercent(soc)}`);
      T('#label-batterie-text .val',
        `${p.battery > 0 ? 'entlädt' : p.battery < 0 ? 'lädt' : 'bereit'} ${fmtPower(Math.abs(p.battery))}`);
      const outE = sum(h, c.battery_out_energy, energy);
      const inE = sum(h, c.battery_in_energy, energy);
      T('#label-batterie-text .sum-out', tot && outE !== null ? `entladen ${fmtEnergy(outE)}` : '');
      T('#label-batterie-text .sum-in', tot && inE !== null ? `geladen ${fmtEnergy(inE)}` : '');
      if (soc !== null) {
        svg.style.setProperty('--soc', (Math.max(0, Math.min(100, soc)) / 100).toFixed(3));
      }
      svg.querySelector('#battery')?.classList.toggle('is-active', Math.abs(p.battery) >= 20);
    }

    /* --- Wallboxen: eine Zeile je Fahrzeug --- */
    if (has.wallbox) {
      const list = this.#wallboxes();
      const rows = this.#wallboxRows(svg);
      rows.forEach((row, i) => {
        const wb = list[i];
        const show = !!wb;
        for (const el of row) el.style.display = show ? '' : 'none';
        if (!show) return;
        const pw = Math.abs(power(h, wb.power_entity) ?? 0);
        const soc = num(h, wb.car_soc_entity);
        row.forEach((el) => {
          const cls = el.getAttribute('class');
          if (cls === 'car') el.textContent = wb.name ?? `Auto ${i + 1}`;
          else if (cls === 'car-val' || cls === 'car-sum') {
            el.textContent = soc === null ? '' : fmtPercent(soc);
          } else if (cls === 'val') el.textContent = fmtPower(pw);
          else if (cls === 'sum') {
            const e = energy(h, wb.today_energy_entity);
            el.textContent = tot && e !== null ? `(${fmtEnergy(e)})` : '';
          }
        });
      });
      svg.querySelector('#wallbox')?.classList.toggle('is-active', p.wallbox >= 20);
    }

    /* --- Wärmepumpe --- */
    if (has.waermepumpe) {
      T('#label-waermepumpe-text .val', fmtPower(p.heatpump));
      const e = sum(h, c.heatpump_energy, energy);
      T('#label-waermepumpe-text .sum', tot && e !== null ? `(${fmtEnergy(e)})` : '');
      svg.querySelector('#heatpump')?.classList.toggle('is-active', p.heatpump >= 20);
    }

    /* --- Haushalt --- */
    T('#label-haushalt .val', fmtPower(p.house));
    const he = energy(h, c.house_energy);
    T('#label-haushalt .sum', tot && he !== null ? `(${fmtEnergy(he)})` : '');
    svg.querySelector('#house')?.classList.toggle('is-active', p.house >= 20);

    /* --- Flüsse --- */
    this.#flow('solar', p.pv, false, COLORS.pv);
    this.#flow('netz', Math.abs(p.grid), p.grid < 0,
      p.grid >= 0 ? COLORS.grid_import : COLORS.grid_export);
    this.#flow('batterie', Math.abs(p.battery), p.battery < 0,
      p.battery > 0 ? COLORS.battery_out : COLORS.battery_in);
    this.#flow('wallbox', p.wallbox, true, COLORS.wallbox);
    this.#flow('waermepumpe', p.heatpump, true, COLORS.heatpump);
  }

  /** Alle Textzeilen der Wallbox-Gruppe nach Zeile sortiert. */
  #wallboxRows(svg) {
    const texts = [...svg.querySelectorAll('#label-wallbox-text text')].filter(
      (t) => t.getAttribute('class') !== 'name',
    );
    const byY = new Map();
    for (const t of texts) {
      const y = t.getAttribute('y');
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(t);
    }
    return [...byY.entries()].sort((a, b) => Number(a[0]) - Number(b[0])).map(([, els]) => els);
  }

  /** Zusatzzeile unter einem Textblock, etwa die Strang-Näherung. */
  #extraLine(svg, groupSel, id, value) {
    const group = svg.querySelector(groupSel);
    if (!group) return;
    let el = group.querySelector(`#${id}`);
    if (!value) {
      if (el) el.style.display = 'none';
      return;
    }
    if (!el) {
      const ref = group.querySelector('.val');
      if (!ref) return;
      el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      el.setAttribute('id', id);
      el.setAttribute('class', 'sum');
      el.setAttribute('x', ref.getAttribute('x'));
      el.setAttribute('y', String(Number(ref.getAttribute('y')) + 26));
      group.appendChild(el);
    }
    el.style.display = '';
    el.textContent = value;
  }

  #short(name) {
    return name.replace(/(PV|Solar|Leistung|Power)/gi, '').replace(/\s+/g, ' ').trim() || name;
  }

  #flow(key, watt, reverse, color) {
    const pair = this.#els.flows?.[key];
    if (!pair) return;
    const on = Math.abs(watt) >= 20;
    const dur = Math.max(0.4, Math.min(2.4, 2200 / Math.max(1, Math.abs(watt))));
    for (const el of [pair.thin, pair.fat]) {
      el.style.opacity = on ? '' : '0';
      el.style.stroke = color;
      el.style.setProperty('--dur', `${dur.toFixed(2)}s`);
      el.classList.toggle('rev', !!reverse);
    }
  }

  /* ------------------------------ Geld ------------------------------ */

  #renderMoney() {
    const c = this.#config;
    const h = this.#hass;
    const imp = sum(h, c.grid_import_energy, energy);
    const exp = sum(h, c.grid_export_energy, energy);
    const pv = sum(h, c.pv_energy, energy);
    const pImp = priceInfo(h, c, 'import').now;
    const pExp = priceInfo(h, c, 'export').now;
    const ref = c.price_reference ?? pImp;

    const items = [];
    if (exp !== null && pExp !== null) {
      items.push({ k: 'Einspeisung heute', v: fmtEuro((exp * pExp) / 100) });
    }
    if (imp !== null && pImp !== null) {
      items.push({ k: 'Netzbezug heute', v: fmtEuro(-(imp * pImp) / 100) });
    }
    if (items.length === 2) {
      items.push({ k: 'Bilanz', v: fmtEuro((exp * pExp - imp * pImp) / 100) });
    }
    if (pv !== null && ref !== null) {
      const own = Math.max(0, pv - (exp ?? 0));
      items.push({ k: 'Durch PV gespart', v: fmtEuro((own * ref) / 100, { signed: false }) });
    }

    this.#els.money.innerHTML = items
      .map((i) => `<div class="tile"><span class="k">${i.k}</span><span class="v">${i.v}</span></div>`)
      .join('');
  }

  /* --------------------- Preis und Prognose in einem ---------------- */

  #pvCurve() {
    const ids = asList(this.#config.pv_forecast_entities);
    const attr = this.#config.pv_forecast_attribute ?? 'watt_hours_period';
    const byHour = new Map();
    let total = 0;
    for (const id of ids) {
      const st = this.#hass.states[id];
      if (!st) continue;
      const v = energy(this.#hass, id);
      if (v !== null) total += v;
      const raw = st.attributes[attr];
      if (raw && typeof raw === 'object') {
        for (const [t, wh] of Object.entries(raw)) {
          const d = new Date(t);
          if (d.toDateString() !== new Date().toDateString()) continue;
          byHour.set(d.getHours(), (byHour.get(d.getHours()) ?? 0) + Number(wh) / 1000);
        }
      }
    }
    return { byHour, total };
  }

  #renderPlot() {
    const c = this.#config;
    const price = priceInfo(this.#hass, c, 'import');
    const { byHour, total } = this.#pvCurve();
    const hasPrice = price.forecast.length > 0;
    const hasPv = byHour.size > 0;

    if (!hasPrice && !hasPv) {
      this.#els.forecast.hidden = true;
      return;
    }
    this.#els.forecast.hidden = false;

    const W = 1000, H = 190, L = 52, R = 54, T = 10, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const X = (i) => L + (i / 23) * pw;
    const pvVals = Array.from({ length: 24 }, (_, i) => byHour.get(i) ?? 0);
    const pvMax = Math.max(...pvVals, 0.1);
    const today = new Date().toDateString();
    const prVals = Array.from({ length: 24 }, (_, i) => {
      const e = price.forecast.find(
        (f) => f.time.getHours() === i && f.time.toDateString() === today,
      );
      return e ? e.value : null;
    });
    const known = prVals.filter((v) => v !== null);
    const cMin = known.length ? Math.min(...known) : 0;
    const cMax = known.length ? Math.max(...known) : 1;

    const out = [`<defs><linearGradient id="pvg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: ${COLORS.pv}; stop-opacity: .6"/>
      <stop offset="1" style="stop-color: ${COLORS.pv}; stop-opacity: 0"/></linearGradient></defs>`];

    if (hasPv) {
      const pts = pvVals.map((v, i) => `${X(i).toFixed(1)} ${(T + ph - (v / pvMax) * ph).toFixed(1)}`);
      out.push(`<path d="M${pts.join(' L')} L${X(23).toFixed(1)} ${T + ph} L${L} ${T + ph} Z" fill="url(#pvg)"/>`);
      out.push(`<path d="M${pts.join(' L')}" fill="none" stroke-width="2.5" style="stroke: ${COLORS.pv}"/>`);
      out.push(`<text class="axis" x="${L - 8}" y="${T + 12}" text-anchor="end">${pvMax.toFixed(1).replace('.', ',')}</text>`);
    }
    if (hasPrice) {
      const seg = [];
      prVals.forEach((v, i) => {
        if (v === null) return;
        seg.push(`${X(i).toFixed(1)} ${(T + ph - ((v - cMin) / (cMax - cMin || 1)) * ph).toFixed(1)}`);
      });
      out.push(`<path d="M${seg.join(' L')}" fill="none" stroke-width="2.5" stroke-dasharray="6 4" style="stroke: ${COLORS.price}"/>`);
      out.push(`<text class="axis" x="${W - R + 8}" y="${T + 12}">${Math.round(cMax)}</text>`);
      out.push(`<text class="axis" x="${W - R + 8}" y="${T + ph}">${Math.round(cMin)}</text>`);
    }
    for (const i of [0, 6, 12, 18, 23]) {
      out.push(`<text class="axis" x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${String(i).padStart(2, '0')}</text>`);
    }

    this.#els.plot.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Strompreis und PV-Prognose">${out.join('')}</svg>`;
    this.#els.legend.innerHTML =
      (hasPv ? `<span style="color:${COLORS.pv}">▬</span> Erzeugung kW${total ? ` (${fmtEnergy(total)})` : ''}` : '') +
      (hasPrice
        ? ` <span style="color:${COLORS.price}">▭</span> Preis ct/kWh`
        : price.now !== null ? ` Preis ${fmtPrice(price.now)}` : '');
  }

  /* ------------------------------ Wetter ---------------------------- */

  #renderWeather() {
    const e = this.#config.weather_entity;
    const st = e ? this.#hass.states[e] : null;
    this.#els.weather.hidden = !st;
    if (!st) return;
    this.#els.wIcon.setAttribute('icon', weatherIcon(st.state));
    const t = st.attributes.temperature;
    this.#els.wTemp.textContent = t === undefined ? '–' : `${Math.round(t)}°`;
  }

  async #loadForecast() {
    const e = this.#config.weather_entity;
    if (!e || !this.#hass) return;
    try {
      const res = await this.#hass.callService(
        'weather', 'get_forecasts', { type: 'daily' }, { entity_id: e }, false, true,
      );
      this.#forecast = res?.response?.[e]?.forecast ?? null;
    } catch {
      this.#forecast = this.#hass.states[e]?.attributes?.forecast ?? null;
    }
    this.#renderForecast();
  }

  #renderForecast() {
    if (!this.#els.fcBody) return;
    const rows = (this.#forecast ?? []).slice(0, 5).map((f) => {
      const d = new Date(f.datetime);
      return `<div class="row"><span class="day">${WEEKDAYS[d.getDay()]}</span>
        ${icon(weatherIcon(f.condition))}<span></span>
        <span class="temps"><b>${Math.round(f.temperature)}°</b>${
          f.templow !== undefined ? ` / ${Math.round(f.templow)}°` : ''
        }</span></div>`;
    });
    for (const id of asList(this.#config.pv_forecast_entities)) {
      const st = this.#hass?.states?.[id];
      if (!st) continue;
      rows.push(`<div class="extra"><span>${esc(st.attributes.friendly_name ?? id)}</span>
        <b>${esc(st.state)} ${esc(st.attributes.unit_of_measurement ?? '')}</b></div>`);
    }
    this.#els.fcBody.innerHTML = rows.length ? rows.join('') : '<p>Keine Vorhersage verfügbar.</p>';
  }
}

      chips: card.querySelector('.chips'),
      chart: card.querySelector('.chart'),
      tip: card.querySelector('.tip'),
      soc: card.querySelector('.soc'),
      socTitle: card.querySelector('.soc-title'),
      groups: card.querySelector('.groups'),
      buttons: [...card.querySelectorAll('[data-preset]')],
      dialog: card.querySelector('dialog.picker'),
      from: card.querySelector('input.from'),
      to: card.querySelector('input.to'),
    };

    for (const btn of this.#els.buttons) {
      btn.addEventListener('click', () => {
        if (btn.dataset.preset === 'custom') {
          const { start, end } = this.#range();
          this.#els.from.value = isoDate(start);
          this.#els.to.value = isoDate(new Date(end.getTime() - 1));
          this.#els.dialog.showModal();
          return;
        }
        this.#preset = btn.dataset.preset;
        this.#custom = null;
        this.#load();
      });
    }
    card.querySelector('.cancel').addEventListener('click', () => this.#els.dialog.close());
    card.querySelector('.ok').addEventListener('click', () => {
      const from = this.#els.from.valueAsDate;
      const to = this.#els.to.valueAsDate;
      if (!from || !to) return;
      this.#custom = { start: startOfDay(from), end: new Date(startOfDay(to).getTime() + 86_400_000) };
      this.#preset = 'custom';
      this.#els.dialog.close();
      this.#load();
    });

    this.#els.title.textContent = this.#config.title ?? '';
    this.#built = true;
    this.#renderState('Daten werden geladen …');
    this.#syncButtons();
  }

  /* ------------------------------ Zeitraum -------------------------- */

  #range() {
    const now = new Date();
    const today = startOfDay(now);
    if (this.#preset === 'custom' && this.#custom) {
      const days = (this.#custom.end - this.#custom.start) / 86_400_000;
      return { ...this.#custom, period: days <= 2 ? 'hour' : days <= 70 ? 'day' : 'month', area: days <= 8 };
    }
    switch (this.#preset) {
      case 'week': {
        const wd = (today.getDay() + 6) % 7;
        return { start: new Date(today.getTime() - wd * 86_400_000), end: now, period: 'day', area: true };
      }
      case 'month':
        return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: now, period: 'day', area: false };
      case 'year':
        return { start: new Date(now.getFullYear(), 0, 1), end: now, period: 'month', area: false };
      default:
        return { start: today, end: now, period: 'hour', area: true };
    }
  }

  #rangeLabel(start, end) {
    const f = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const last = new Date(end.getTime() - 1);
    return isoDate(start) === isoDate(last) ? f.format(start) : `${f.format(start)} – ${f.format(last)}`;
  }

  /* ------------------------------ Daten ----------------------------- */

  #used() { return SERIES.filter((s) => asList(this.#config[s.key]).length); }

  async #load() {
    if (!this.#hass || !this.#built) return;
    const used = this.#used();
    const socIds = asList(this.#config.battery_soc);
    if (!used.length) {
      this.#renderState('Noch keine Sensoren zugeordnet. Seitenleiste → wuefl Energie → Energie-Ansicht.');
      return;
    }

    const ids = [...new Set([...used.flatMap((s) => asList(this.#config[s.key])), ...socIds])];
    const { start, end, period, area } = this.#range();
    this.#els.range.textContent = this.#rangeLabel(start, end);
    this.#syncButtons();

    try {
      const stats = await this.#hass.callWS({
        type: 'recorder/statistics_during_period',
        start_time: start.toISOString(),
        end_time: end.toISOString(),
        statistic_ids: ids,
        period,
        types: ['change', 'mean'],
      });
      this.#data = { ...this.#bucketize(stats, used, socIds), period, area };
      this.#renderChips();
      this.#renderChart();
      this.#renderSoc();
      this.#renderGroups();
    } catch (err) {
      this.#renderState('Statistiken konnten nicht geladen werden. Prüfen, ob der Recorder die Sensoren aufzeichnet.');
      console.error('[wuefl-energy] statistics_during_period', err);
    }
  }

  #bucketize(stats, used, socIds) {
    const index = new Map();
    const buckets = [];
    const at = (ts) => {
      if (!index.has(ts)) {
        index.set(ts, buckets.length);
        buckets.push({ ts, values: {}, soc: null, socN: 0 });
      }
      return buckets[index.get(ts)];
    };

    for (const s of used) {
      for (const id of asList(this.#config[s.key])) {
        for (const row of stats[id] ?? []) {
          const ts = typeof row.start === 'number' ? row.start : Date.parse(row.start);
          if (row.change === null || row.change === undefined) continue;
          const b = at(ts);
          b.values[s.key] = (b.values[s.key] ?? 0) + Math.abs(row.change);
        }
      }
    }
    for (const id of socIds) {
      for (const row of stats[id] ?? []) {
        const ts = typeof row.start === 'number' ? row.start : Date.parse(row.start);
        if (row.mean === null || row.mean === undefined) continue;
        const b = at(ts);
        b.soc = (b.soc ?? 0) + row.mean;
        b.socN += 1;
      }
    }
    buckets.sort((a, b) => a.ts - b.ts);
    for (const b of buckets) if (b.socN) b.soc /= b.socN;

    const totals = {};
    for (const s of used) totals[s.key] = buckets.reduce((a, b) => a + (b.values[s.key] ?? 0), 0);
    return { buckets, totals, hasSoc: socIds.length > 0 };
  }

  /* ------------------------------ Ausgabe --------------------------- */

  #syncButtons() {
    for (const b of this.#els.buttons) b.setAttribute('aria-pressed', String(b.dataset.preset === this.#preset));
  }

  #renderState(text) {
    this.#els.chart.innerHTML = `<div class="state">${text}</div>`;
    this.#els.soc.innerHTML = '';
    this.#els.socTitle.style.display = 'none';
  }

  #visible() { return this.#used().filter((s) => !this.#hidden.has(s.key)); }

  #renderChips() {
    this.#els.chips.innerHTML = this.#used()
      .map((s) => {
        const off = this.#hidden.has(s.key);
        return `<button type="button" data-series="${s.key}" class="${off ? 'off' : ''}" aria-pressed="${!off}">
          <span class="dot" style="background:${s.color}"></span>${s.label}</button>`;
      })
      .join('');
    for (const btn of this.#els.chips.querySelectorAll('[data-series]')) {
      btn.addEventListener('click', () => {
        const k = btn.dataset.series;
        this.#hidden.has(k) ? this.#hidden.delete(k) : this.#hidden.add(k);
        this.#renderChips();
        this.#renderChart();
        this.#renderGroups();
      });
    }
  }

  #renderChart() {
    const { buckets, period, area } = this.#data;
    if (!buckets.length) {
      this.#renderState('Für diesen Zeitraum liegen keine Statistiken vor.');
      return;
    }

    const W = 1000, H = 420, L = 78, R = 20, T = 16, B = 34;
    const pw = W - L - R, ph = H - T - B;
    const up = this.#visible().filter((s) => s.sign > 0);
    const dn = this.#visible().filter((s) => s.sign < 0);

    let pm = 0, nm = 0;
    for (const b of buckets) {
      pm = Math.max(pm, up.reduce((a, s) => a + (b.values[s.key] ?? 0), 0));
      nm = Math.max(nm, dn.reduce((a, s) => a + (b.values[s.key] ?? 0), 0));
    }
    const span = pm + nm || 1;
    const zero = T + (pm / span) * ph;
    const n = buckets.length;
    const X = area
      ? (i) => L + (n < 2 ? pw / 2 : (i / (n - 1)) * pw)
      : (i) => L + (i + 0.5) * (pw / n);
    this.#geo = { X, zero, span, ph, T, L, pw, W, H, n };

    const out = ['<defs>'];
    for (const s of [...up, ...dn]) {
      out.push(`<linearGradient id="grad-${s.key}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: ${s.color}; stop-opacity: .8"/>
        <stop offset="1" style="stop-color: ${s.color}; stop-opacity: .15"/></linearGradient>`);
    }
    out.push('</defs>');

    // Gitter und Achsenzahlen ober- und unterhalb der Null
    for (const f of [0.5, 1]) {
      const yUp = zero - f * (zero - T);
      const yDn = zero + f * (T + ph - zero);
      out.push(`<line class="grid-line" x1="${L}" y1="${yUp.toFixed(1)}" x2="${W - R}" y2="${yUp.toFixed(1)}"/>`);
      out.push(`<line class="grid-line" x1="${L}" y1="${yDn.toFixed(1)}" x2="${W - R}" y2="${yDn.toFixed(1)}"/>`);
      out.push(`<text class="axis" x="${L - 10}" y="${(yUp + 5).toFixed(1)}" text-anchor="end">${fmtEnergy(pm * f)}</text>`);
      out.push(`<text class="axis" x="${L - 10}" y="${(yDn + 5).toFixed(1)}" text-anchor="end">${fmtEnergy(nm * f)}</text>`);
    }
    out.push(`<line class="zero" x1="${L}" y1="${zero}" x2="${W - R}" y2="${zero}"/>`);
    out.push(`<text class="axis" x="${L - 10}" y="${zero + 5}" text-anchor="end">0</text>`);
    out.push(`<text class="side" x="${L + 6}" y="${T + 14}">Erzeugung und Bezug</text>`);
    out.push(`<text class="side" x="${L + 6}" y="${T + ph - 5}">Verbrauch und Einspeisung</text>`);

    if (area) {
      for (const [side, set] of [[1, up], [-1, dn]]) {
        let base = new Array(n).fill(0);
        for (const s of set) {
          const top = buckets.map((b, i) => base[i] + (b.values[s.key] ?? 0));
          const upper = top.map((v, i) => `${X(i).toFixed(1)} ${(zero - (side * v * ph) / span).toFixed(1)}`);
          const lower = base.map((v, i) => `${X(i).toFixed(1)} ${(zero - (side * v * ph) / span).toFixed(1)}`).reverse();
          out.push(`<path d="M${upper.join(' L')} L${lower.join(' L')} Z" fill="url(#grad-${s.key})" stroke-width="1.5" style="stroke: ${s.color}"/>`);
          base = top;
        }
      }
    } else {
      const bw = Math.max(3, Math.min(28, (pw / n) * 0.6));
      buckets.forEach((b, i) => {
        const cx = X(i);
        let top = zero, bottom = zero;
        for (const s of up) {
          const h = ((b.values[s.key] ?? 0) * ph) / span;
          if (h < 0.4) continue;
          top -= h;
          out.push(`<rect x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" style="fill: ${s.color}"/>`);
        }
        for (const s of dn) {
          const h = ((b.values[s.key] ?? 0) * ph) / span;
          if (h < 0.4) continue;
          out.push(`<rect x="${(cx - bw / 2).toFixed(1)}" y="${bottom.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" style="fill: ${s.color}"/>`);
          bottom += h;
        }
      });
    }

    const step = Math.max(1, Math.ceil(n / 12));
    buckets.forEach((b, i) => {
      if (i % step) return;
      out.push(`<text class="axis" x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${this.#tick(b.ts, period)}</text>`);
    });
    out.push(`<line id="cursor" x1="0" y1="${T}" x2="0" y2="${T + ph}" stroke-width="1" opacity="0" style="stroke: var(--w-text-soft)"/><g id="marks"></g>`);

    this.#els.chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Energiebilanz">${out.join('')}</svg>`;
    this.#els.chart.appendChild(this.#els.tip);
    this.#hookPointer();
  }

  #renderSoc() {
    const { buckets, hasSoc } = this.#data;
    const points = buckets.filter((b) => b.soc !== null);
    this.#els.socTitle.style.display = hasSoc && points.length ? '' : 'none';
    if (!hasSoc || !points.length || !this.#geo) {
      this.#els.soc.innerHTML = '';
      return;
    }

    const { X, L, W } = this.#geo;
    const H = 130, T = 10, B = 22;
    const ph = H - T - B;
    const pts = buckets
      .map((b, i) => (b.soc === null ? null : `${X(i).toFixed(1)} ${(T + (1 - Math.max(0, Math.min(100, b.soc)) / 100) * ph).toFixed(1)}`))
      .filter(Boolean);

    const out = [`<defs><linearGradient id="socg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: ${COLORS.battery_out}; stop-opacity: .45"/>
      <stop offset="1" style="stop-color: ${COLORS.battery_out}; stop-opacity: 0"/></linearGradient></defs>`];
    out.push(`<path d="M${pts.join(' L')} L${X(buckets.length - 1).toFixed(1)} ${T + ph} L${X(0).toFixed(1)} ${T + ph} Z" fill="url(#socg)"/>`);
    out.push(`<path d="M${pts.join(' L')}" fill="none" stroke-width="2.5" style="stroke: ${COLORS.battery_out}"/>`);
    out.push(`<text class="axis" x="${L - 10}" y="${T + 12}" text-anchor="end">100 %</text>`);
    out.push(`<text class="axis" x="${L - 10}" y="${T + ph}" text-anchor="end">0 %</text>`);

    this.#els.soc.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ladestand der Speicher">${out.join('')}</svg>`;
  }

  #tick(ts, period) {
    const d = new Date(ts);
    if (period === 'hour') return String(d.getHours()).padStart(2, '0');
    if (period === 'month') return new Intl.DateTimeFormat('de-DE', { month: 'short' }).format(d);
    return new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit' }).format(d);
  }

  #stamp(ts, period) {
    const d = new Date(ts);
    if (period === 'hour') return `${String(d.getHours()).padStart(2, '0')}:00 Uhr`;
    if (period === 'month') return new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' }).format(d);
    return new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }).format(d);
  }

  #hookPointer() {
    const svg = this.#els.chart.querySelector('svg');
    const tip = this.#els.tip;
    const cursor = svg.querySelector('#cursor');
    const marks = svg.querySelector('#marks');
    const { buckets, period } = this.#data;

    const move = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const vx = ((clientX - rect.left) / rect.width) * this.#geo.W;
      let best = 0, dist = Infinity;
      buckets.forEach((_, i) => {
        const d = Math.abs(this.#geo.X(i) - vx);
        if (d < dist) { dist = d; best = i; }
      });

      const b = buckets[best];
      const gx = this.#geo.X(best);
      cursor.setAttribute('x1', gx);
      cursor.setAttribute('x2', gx);
      cursor.setAttribute('opacity', '0.7');

      let top = this.#geo.zero, bottom = this.#geo.zero;
      let dots = '';
      const rows = [];
      for (const s of this.#visible()) {
        const v = b.values[s.key] ?? 0;
        if (v < 0.001) continue;
        const h = (v * this.#geo.ph) / this.#geo.span;
        const y = s.sign > 0 ? (top -= h) : (bottom += h);
        dots += `<circle cx="${gx.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" stroke-width="1.5" style="fill: ${s.color}; stroke: var(--w-bg)"/>`;
        rows.push(`<div class="line"><span><span class="dot" style="background:${s.color}"></span>${s.label}</span><b>${fmtSigned(s.sign * v)}</b></div>`);
      }
      marks.innerHTML = dots;

      tip.innerHTML =
        `<div class="when">${this.#stamp(b.ts, period)}</div>` +
        (rows.join('') || '<div class="line">Keine Werte</div>') +
        (b.soc === null ? '' : `<div class="line soc-line"><span>Ladestand</span><b>${fmtPercent(b.soc)}</b></div>`);
      tip.style.display = 'block';
      const host = this.#els.chart.clientWidth;
      const px = (gx / this.#geo.W) * host;
      tip.style.left = `${Math.max(0, Math.min(host - tip.offsetWidth, px - tip.offsetWidth / 2))}px`;
    };

    const clear = () => {
      tip.style.display = 'none';
      cursor.setAttribute('opacity', '0');
      marks.innerHTML = '';
    };

    svg.addEventListener('mousemove', (e) => move(e.clientX));
    svg.addEventListener('mouseleave', clear);
    svg.addEventListener('touchstart', (e) => move(e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchmove', (e) => { move(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
    svg.addEventListener('touchend', clear);
  }

  #renderGroups() {
    const { totals } = this.#data;
    const used = this.#used();
    const html = [];

    for (const group of GROUPS) {
      const items = used.filter((s) => s.group === group);
      if (!items.length) continue;
      const rows = items
        .map((s) => `<div class="row"><span class="name">
            ${icon(s.icon, `style="color: ${s.color}"`)}${s.label}</span>
            <b>${fmtSigned(s.sign * (totals[s.key] ?? 0))}</b></div>`)
        .join('');

      let footer = '';
      if (items.length > 1) {
        const net = items.reduce((a, s) => a + s.sign * (totals[s.key] ?? 0), 0);
        const value = group === 'Verbrauch'
          ? fmtEnergy(items.reduce((a, s) => a + (totals[s.key] ?? 0), 0))
          : fmtSigned(net);
        footer = `<div class="row sumline"><span>${group === 'Verbrauch' ? 'Summe' : 'Bilanz'}</span><b>${value}</b></div>`;
      }
      html.push(`<div class="group"><h3>${group}</h3>${rows}${footer}</div>`);
    }
    this.#els.groups.innerHTML = html.join('');
  }
}

  & .body { background: var(--w-bg-soft); border-radius: var(--w-radius); padding: .65rem .75rem; }
}

.slider {
  & + .slider { margin-top: .8rem; }
  & .line { display: flex; font-size: var(--w-fs-sm); justify-content: space-between; }
  & input[type="range"] { accent-color: var(--w-accent); margin-top: .25rem; width: 100%; }
  & output { font-variant-numeric: tabular-nums; font-weight: 600; }
  & .note { color: var(--w-text-soft); display: block; font-size: var(--w-fs-sm); }
}

.switchrow {
  align-items: center; display: flex; gap: .75rem; justify-content: space-between;

  & .switch {
    background: var(--w-line); border: 0; border-radius: 999px; cursor: pointer;
    flex: 0 0 auto; height: 1.6rem; padding: .15rem; width: 2.9rem;

    & span { background: #fff; border-radius: 50%; display: block; height: 1.3rem;
             transition: transform .2s ease; width: 1.3rem; }
    &[aria-checked="true"] { background: ${COLORS.battery_out}; & span { transform: translateX(1.3rem); } }
  }
  & .note { color: var(--w-text-soft); display: block; font-size: var(--w-fs-sm); }
}

.stats {
  display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); margin-top: .75rem;

  & .tile .v { font-size: 1.05rem; }
}
`;

class WueflWallboxCard extends HTMLElement {
  #own = {};
  #central = {};
  #config = {};
  #hass = null;
  #built = false;
  #els = {};
  #watch = [];
  #drag = null;
  #once = false;
  #savedTarget = null;

  static getConfigElement() { return document.createElement('wuefl-wallbox-card-editor'); }
  static getStubConfig() { return { slot: 1 }; }

  setConfig(config) {
    this.#own = config ?? {};
    this.#apply();
  }

  /**
   * hass wird bei jeder Zustandsänderung im ganzen System gesetzt. Neu
   * gezeichnet wird nur, wenn eine der benutzten Entitäten betroffen ist.
   */
  set hass(hass) {
    const first = !this.#hass;
    const prev = this.#hass;
    this.#hass = hass;
    if (first) {
      this.#loadCentral();
      window.addEventListener('wuefl-energy-config-changed', () => this.#loadCentral());
    }
    if (first || statesChanged(prev, hass, this.#watch)) this.#update();
  }

  getCardSize() { return 9; }

  async #loadCentral() {
    const all = await centralConfig(this.#hass);
    const slot = this.#own.slot ?? 1;
    this.#central = { ...(all[`wallbox_${slot}`] ?? {}), ...(all.price ?? {}) };
    if (all.live?.pv_forecast_entities) this.#central.pv_forecast_entities = all.live.pv_forecast_entities;
    this.#apply();
    this.#update();
  }

  #apply() {
    const merged = mergeConfig(this.#central, this.#own);
    this.#config = { name: 'Wallbox', capacity: 58, max_power: 11000, house_base_load: 400, ...merged };
    this.#watch = entityIds(this.#config);
    this.#built = false;
    if (this.shadowRoot) this.shadowRoot.replaceChildren();
    this.#build();
  }

  /* ------------------------------ Aufbau ---------------------------- */

  #build() {
    const root = this.shadowRoot ?? this.attachShadow({ mode: 'open' });
    adoptSheet(root, CSS, 'wallbox');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top">
        <div><div class="name"></div><div class="state"></div></div>
        <div class="goal"><span class="goal-main"></span><small class="goal-note"></small></div>
      </div>

      <div class="track" hidden>
        <div class="fill"></div>
        <div class="mark target"></div>
        <div class="mark old" hidden></div>
      </div>
      <div class="scale" hidden><span class="soc-now"></span><span class="soc-goal"></span></div>

      <div class="once" hidden>
        <span class="badge">Einmalig 100 % aktiv</span>
        <button type="button" class="btn undo">Zurücknehmen</button>
        <span class="hint"></span>
      </div>

      <div class="modes"></div>

      <div class="target" hidden>
        <label for="tgt">Ladeziel</label>
        <input type="range" id="tgt" min="20" max="100" step="5">
        <output>–</output>
        <button type="button" class="btn full">Einmalig 100 %</button>
      </div>

      <details class="adv">
        <summary>${icon('mdi:tune')}Mehr Optionen</summary>
        <div class="body">
          <div class="slider limit" hidden>
            <div class="line"><span>Netzstrom nutzen bis</span><output>–</output></div>
            <input type="range">
            <span class="note">Gilt im Modus mit günstigem Strom. Liegt der Preis darüber, wartet die Wallbox auf Sonne.</span>
          </div>
          <div class="slider cur" hidden>
            <div class="line"><span>Maximaler Ladestrom</span><output>–</output></div>
            <input type="range">
            <span class="note">Begrenzt den Strom pro Phase. 16 A sind rund 11 kW, 6 A rund 4 kW. Nur nötig, wenn Hausanschluss oder Leitung das verlangen — im Solarbetrieb regelt die Automatik den Wert selbst.</span>
          </div>
        </div>
      </details>

      <details class="batt">
        <summary>${icon('mdi:home-battery')}Hausakku</summary>
        <div class="body">
          <div class="switchrow use" hidden>
            <span>Aus Hausakku laden<span class="note">Erlaubt dem Auto, Strom aus den Speichern zu ziehen.</span></span>
            <button class="switch" role="switch" aria-checked="false" type="button"><span></span></button>
          </div>
          <div class="slider reserve" hidden>
            <div class="line"><span>Speicher nutzen bis</span><output>–</output></div>
            <input type="range" min="0" max="100" step="5">
            <span class="note">Darunter bleiben die Speicher fürs Haus reserviert.</span>
          </div>
          <div class="modes prio" hidden></div>
        </div>
      </details>

      <div class="stats"></div>
    `;
    root.appendChild(card);

    const q = (s) => card.querySelector(s);
    this.#els = {
      card,
      name: q('.name'), state: q('.state'),
      goalMain: q('.goal-main'), goalNote: q('.goal-note'),
      track: q('.track'), fill: q('.fill'),
      markTarget: q('.mark.target'), markOld: q('.mark.old'),
      scale: q('.scale'), socNow: q('.soc-now'), socGoal: q('.soc-goal'),
      once: q('.once'), undo: q('.undo'), onceHint: q('.once .hint'),
      modes: q('.modes'), prio: q('.modes.prio'),
      target: q('.target'), targetInput: q('.target input'), targetOut: q('.target output'), full: q('.full'),
      limit: q('.slider.limit'), cur: q('.slider.cur'), reserve: q('.slider.reserve'),
      use: q('.switchrow.use'), useSwitch: q('.switchrow.use .switch'),
      adv: q('details.adv'), batt: q('details.batt'),
      stats: q('.stats'),
    };

    this.#els.targetInput.addEventListener('input', () => {
      this.#drag = 'target';
      this.#els.targetOut.textContent = fmtPercent(Number(this.#els.targetInput.value));
    });
    this.#els.targetInput.addEventListener('change', () => {
      this.#drag = null;
      this.#setNumber(this.#config.target_soc_entity, Number(this.#els.targetInput.value));
    });

    this.#els.full.addEventListener('click', () => {
      this.#savedTarget = num(this.#hass, this.#config.target_soc_entity);
      this.#once = true;
      this.#setNumber(this.#config.target_soc_entity, 100);
      this.#update();
    });
    this.#els.undo.addEventListener('click', () => {
      this.#once = false;
      if (this.#savedTarget !== null) this.#setNumber(this.#config.target_soc_entity, this.#savedTarget);
      this.#update();
    });

    for (const [key, cfgKey] of [
      ['limit', 'price_limit_entity'],
      ['cur', 'current_entity'],
      ['reserve', 'battery_reserve_entity'],
    ]) {
      const box = this.#els[key];
      const input = box.querySelector('input');
      const out = box.querySelector('output');
      input.addEventListener('input', () => {
        this.#drag = key;
        out.textContent = this.#sliderText(key, Number(input.value));
      });
      input.addEventListener('change', () => {
        this.#drag = null;
        this.#setNumber(this.#config[cfgKey], Number(input.value));
      });
    }

    this.#els.useSwitch.addEventListener('click', () => {
      const on = this.#els.useSwitch.getAttribute('aria-checked') === 'true';
      this.#toggle(this.#config.battery_use_entity, !on);
    });

    this.#built = true;
    this.#update();
  }

  /* ------------------------------ Dienste --------------------------- */

  #domain(e) { return e ? e.split('.')[0] : null; }

  #setOption(id, option) {
    const d = this.#domain(id);
    if (d) this.#hass.callService(d, 'select_option', { entity_id: id, option });
  }

  #setNumber(id, value) {
    const d = this.#domain(id);
    if (d) this.#hass.callService(d, 'set_value', { entity_id: id, value });
  }

  #toggle(id, on) {
    const d = this.#domain(id);
    if (d) this.#hass.callService(d, on ? 'turn_on' : 'turn_off', { entity_id: id });
  }

  #sliderText(key, v) {
    if (key === 'cur') {
      const u = this.#hass?.states?.[this.#config.current_entity]?.attributes?.unit_of_measurement ?? 'A';
      return `${v} ${u}`;
    }
    if (key === 'limit') return `${fmtPrice(v)}/kWh`;
    return fmtPercent(v);
  }

  /* ------------------------------ Prognose -------------------------- */

  #solarOutlook() {
    const ids = asList(this.#config.pv_forecast_entities);
    const attr = this.#config.pv_forecast_attribute ?? 'watt_hours_period';
    const now = new Date();
    let rest = 0;
    let lastHour = now.getHours();

    for (const id of ids) {
      const st = this.#hass.states[id];
      if (!st) continue;
      const raw = st.attributes[attr];
      if (raw && typeof raw === 'object') {
        for (const [t, wh] of Object.entries(raw)) {
          const d = new Date(t);
          if (d > now && d.toDateString() === now.toDateString()) {
            rest += Number(wh) / 1000;
            lastHour = Math.max(lastHour, d.getHours());
          }
        }
      } else {
        const v = energy(this.#hass, id);
        if (v !== null) rest += v * 0.5;
      }
    }
    return { rest, hours: Math.max(0, lastHour - now.getHours()) };
  }

  /** Ergebnis: was oben rechts steht, plus die Zeile darunter. */
  #estimate(kind, needed, goal) {
    const c = this.#config;
    if (needed <= 0) return { main: `Ladeziel ${fmtPercent(goal)} erreicht`, note: '' };
    if (kind === 'off') return { main: 'Laden aus', note: '' };

    const done = (hours, note) => {
      if (!Number.isFinite(hours) || hours <= 0) return { main: 'wird berechnet', note };
      if (hours > 24) return { main: 'heute nicht mehr erreichbar', note };
      return {
        main: `Ladeziel ${fmtPercent(goal)} um ${fmtClock(new Date(Date.now() + hours * 3_600_000))}`,
        note: `noch ${fmtDuration(hours)}${note ? ` · ${note}` : ''}`,
      };
    };

    const full = (c.max_power ?? 11000) / 1000;
    if (kind === 'fast') return done(needed / full, `volle Leistung, ${fmtPower(c.max_power ?? 11000)}`);

    const { rest, hours } = this.#solarOutlook();
    const base = (c.house_base_load ?? 400) / 1000;
    const surplus = hours ? rest / hours - base : 0;

    if (kind === 'mix') {
      const price = priceInfo(this.#hass, c, 'import').now;
      const limit = num(this.#hass, c.price_limit_entity);
      if (price !== null && limit !== null && price <= limit) {
        return done(needed / full, `Netzstrom bei ${fmtPrice(price)}/kWh, unter der Grenze von ${fmtPrice(limit)}`);
      }
      if (surplus > 0.2) {
        return done(needed / surplus, 'aus Sonne geschätzt — Netzstrom ist gerade zu teuer');
      }
      return {
        main: `wartet auf ${limit !== null ? `${fmtPrice(limit)}/kWh` : 'günstigen Strom'}`,
        note: price !== null ? `aktuell ${fmtPrice(price)}/kWh, und die Sonne reicht nicht` : '',
      };
    }

    // Reiner Solarbetrieb
    if (!hours || rest <= 0) return { main: 'heute nicht mehr erreichbar', note: 'keine nennenswerte Erzeugung mehr erwartet' };
    if (surplus <= 0.2) return { main: 'heute nicht mehr erreichbar', note: 'die Prognose deckt kaum mehr als den Grundverbrauch' };
    if (needed / surplus > hours) {
      return {
        main: `heute etwa ${fmtEnergy(surplus * hours)}`,
        note: 'geschätzt aus PV-Prognose abzüglich Grundlast — schwankt mit Wetter und Verbrauch',
      };
    }
    return done(needed / surplus, 'geschätzt aus PV-Prognose abzüglich Grundlast — schwankt mit Wetter und Verbrauch');
  }

  /* ------------------------------ Anzeige --------------------------- */

  #update() {
    if (!this.#built || !this.#hass) return;
    const c = this.#config;
    const h = this.#hass;

    this.#els.name.textContent = c.name ?? 'Wallbox';

    const soc = num(h, c.car_soc_entity);
    const target = num(h, c.target_soc_entity);
    const goal = target ?? 100;
    const pw = power(h, c.power_entity) ?? 0;
    const charging = pw > 50;

    const modeState = c.mode_entity ? h.states[c.mode_entity] : null;
    const kind = modeState ? modeInfo(modeState.state).kind : 'other';

    // Erreicht das Fahrzeug sein Ziel, ist die Einmal-Ladung erledigt
    if (this.#once && soc !== null && soc >= 100) this.#once = false;

    let label;
    if (kind === 'off') label = 'Laden aus';
    else if (charging) label = 'lädt';
    else if (soc !== null && soc >= goal) label = 'Ladeziel erreicht';
    else label = 'angeschlossen, lädt nicht';

    const session = energy(h, c.session_energy_entity);
    this.#els.state.textContent =
      (soc === null ? label : `${label} · ${fmtPercent(soc)}`) +
      (charging ? ` · ${fmtPower(pw)}${session !== null ? ` · ${fmtEnergy(session)}` : ''}` : '');

    // Balken mit Ladestand, Zielmarke und altem Ziel
    this.#els.track.hidden = soc === null;
    this.#els.scale.hidden = soc === null;
    if (soc !== null) {
      this.#els.fill.style.width = `${Math.max(0, Math.min(100, soc))}%`;
      this.#els.markTarget.style.left = `${Math.max(0, Math.min(100, goal))}%`;
      const showOld = this.#once && this.#savedTarget !== null;
      this.#els.markOld.hidden = !showOld;
      if (showOld) this.#els.markOld.style.left = `${this.#savedTarget}%`;
      this.#els.socNow.textContent = `Ladestand ${fmtPercent(soc)}`;
      this.#els.socGoal.textContent = `Ladeziel ${fmtPercent(goal)}`;
    }

    this.#els.once.hidden = !this.#once;
    this.#els.onceHint.textContent =
      this.#savedTarget !== null ? `danach wieder ${fmtPercent(this.#savedTarget)}` : '';

    const needed = soc === null ? 0 : ((goal - soc) / 100) * (c.capacity ?? 58);
    const est = this.#estimate(kind, needed, goal);
    this.#els.goalMain.textContent = est.main;
    this.#els.goalNote.textContent = est.note;

    this.#renderModes(this.#els.modes, c.mode_entity);
    this.#renderModes(this.#els.prio, c.priority_entity);
    this.#els.prio.hidden = !c.priority_entity;

    const hasTarget = !!c.target_soc_entity && !!h.states[c.target_soc_entity];
    this.#els.target.hidden = !hasTarget;
    this.#els.full.hidden = this.#once;
    this.#els.targetInput.disabled = this.#once;
    if (hasTarget && this.#drag !== 'target') {
      const shown = this.#once && this.#savedTarget !== null ? this.#savedTarget : goal;
      this.#els.targetInput.value = shown;
      this.#els.targetOut.textContent = fmtPercent(shown);
    }

    this.#syncSlider('limit', c.price_limit_entity, { min: 0, max: 60, step: 1 });
    this.#syncSlider('cur', c.current_entity, { min: 6, max: 16, step: 1 });
    this.#syncSlider('reserve', c.battery_reserve_entity, { min: 0, max: 100, step: 5 });
    this.#els.adv.hidden = this.#els.limit.hidden && this.#els.cur.hidden;

    const hasUse = !!c.battery_use_entity && !!h.states[c.battery_use_entity];
    this.#els.use.hidden = !hasUse;
    if (hasUse) {
      const on = h.states[c.battery_use_entity].state === 'on';
      this.#els.useSwitch.setAttribute('aria-checked', String(on));
      if (!on) this.#els.reserve.hidden = true;
    }
    this.#els.batt.hidden = !hasUse && !c.battery_reserve_entity && !c.priority_entity;

    this.#renderStats();
  }

  #renderModes(container, entityId) {
    if (!entityId || !this.#hass.states[entityId]) {
      container.replaceChildren();
      return;
    }
    const st = this.#hass.states[entityId];
    const options = st.attributes.options ?? [];
    const sig = `${entityId}|${options.join('|')}`;

    if (container.dataset.sig !== sig) {
      container.dataset.sig = sig;
      container.replaceChildren();
      for (const opt of options) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn';
        btn.dataset.option = opt;
        btn.innerHTML = `${icon(modeInfo(opt).icon)}<span class="txt">${esc(opt)}</span>`;
        btn.addEventListener('click', () => this.#setOption(entityId, opt));
        container.appendChild(btn);
      }
    }
    for (const btn of container.children) {
      btn.setAttribute('aria-pressed', String(btn.dataset.option === st.state));
    }
  }

  #syncSlider(key, entityId, fallback) {
    const box = this.#els[key];
    const st = entityId ? this.#hass.states[entityId] : null;
    if (!st) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    const input = box.querySelector('input');
    input.min = st.attributes.min ?? fallback.min;
    input.max = st.attributes.max ?? fallback.max;
    input.step = st.attributes.step ?? fallback.step;
    if (this.#drag === key) return;
    const v = Number(st.state);
    if (!Number.isFinite(v)) return;
    input.value = v;
    box.querySelector('output').textContent = this.#sliderText(key, v);
  }

  #renderStats() {
    const c = this.#config;
    const h = this.#hass;
    const items = [];

    const today = energy(h, c.today_energy_entity);
    if (today !== null) items.push({ e: c.today_energy_entity, k: 'Heute geladen', v: fmtEnergy(today) });
    const total = energy(h, c.total_energy_entity);
    if (total !== null) items.push({ e: c.total_energy_entity, k: 'Gesamt', v: fmtEnergy(total) });
    const socs = asList(c.battery_soc_entity);
    const batt = sum(h, socs, num);
    if (batt !== null) items.push({ e: socs[0], k: 'Hausakku', v: fmtPercent(batt / socs.length) });
    const price = priceInfo(h, c, 'import').now;
    if (price !== null) items.push({ e: c.price_entity, k: 'Strompreis', v: `${fmtPrice(price)}/kWh` });

    this.#els.stats.innerHTML = items
      .map((i) => `<button type="button" class="tile" data-entity="${esc(i.e ?? '')}">
          <span class="k">${i.k}</span><span class="v">${i.v}</span></button>`)
      .join('');
    for (const btn of this.#els.stats.querySelectorAll('[data-entity]')) {
      btn.addEventListener('click', () => moreInfo(this, btn.dataset.entity));
    }
  }
}

  {

/* ================================================================== *
 * 3. Karten einhaengen
 * ================================================================== */

const mounted = [];

function add(target, tag, config) {
  const el = document.createElement(tag);
  el.setConfig(config);
  document.getElementById(target).appendChild(el);
  mounted.push(el);
  return el;
}

function push() {
  // Neues Objekt, damit die Karten die Aenderung bemerken.
  const snapshot = { ...hass, states: { ...hass.states } };
  for (const el of mounted) el.hass = snapshot;
}

add('v-live', 'wuefl-energy-live-card', { title: 'Zuhause', show_totals: true });
add('v-history', 'wuefl-energy-history-card', { title: 'Energie', default_period: 'day' });
add('v-wallbox', 'wuefl-wallbox-card', { slot: 1 });
add('v-wallbox', 'wuefl-wallbox-card', { slot: 2 });
push();

/* Leichte Bewegung, damit die laufenden Kabel und Werte lebendig wirken. */
setInterval(() => {
  const jitter = (id, base, spread) => {
    if (!states[id]) return;
    states[id] = st(Math.round(base + (Math.random() - .5) * spread), states[id].attributes);
  };
  jitter('sensor.pv_power', 4180, 900);
  jitter('sensor.grid_power', -1240, 1400);
  jitter('sensor.battery_power', -820, 700);
  jitter('sensor.house_power', 690, 300);
  jitter('sensor.wallbox_power', 7200, 800);
  push();
}, 2500);

/* ================================================================== *
 * 4. Schalter in der Kopfleiste
 * ================================================================== */

for (const btn of document.querySelectorAll('.bar button')) {
  btn.addEventListener('click', () => {
    const group = btn.dataset.theme ? 'theme' : 'width';
    for (const b of document.querySelectorAll(`.bar button[data-${group}]`)) b.classList.remove('on');
    btn.classList.add('on');

    if (group === 'theme') {
      const dark = btn.dataset.theme === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      hass.themes = { darkMode: dark };
      for (const el of mounted) {
        const svg = el.shadowRoot?.querySelector('.scene svg');
        if (svg) svg.style.colorScheme = dark ? 'dark' : 'light';
      }
      push();
    } else {
      document.body.dataset.width = btn.dataset.width;
    }
  });
}
