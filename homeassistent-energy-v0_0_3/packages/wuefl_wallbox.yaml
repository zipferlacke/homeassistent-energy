# wuefl_wallbox.yaml
#
# Das ist ein Package und gehoert nach config/packages/.
# Voraussetzung in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Helfer für die Wallbox-Karte, ein Beispiel-Preissensor und die
# Automation, die aus Modus und Überschuss einen Ladestrom macht.
#
# Einbinden über configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Bei mehreren Wallboxen: diese Datei kopieren und in allen Namen das
# Kürzel ändern (wallbox_ → wallbox2_). Jede Wallbox bekommt dann eine
# eigene Karte im Dashboard.

input_select:
  wallbox_modus:
    name: Lademodus
    icon: mdi:ev-station
    options:
      - Aus
      - Solar
      - Solar + günstig
      - Schnell

  wallbox_prioritaet:
    name: Priorität
    icon: mdi:priority-high
    options:
      - Hausakku zuerst
      - Auto zuerst

input_number:
  wallbox_ladestrom:
    name: Maximaler Ladestrom
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
    icon: mdi:current-ac

  wallbox_ziel_soc:
    name: Ziel-Ladestand
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-charging-90

  wallbox_preisgrenze:
    name: Preisgrenze fürs Laden
    min: 0
    max: 60
    step: 1
    unit_of_measurement: ct/kWh
    icon: mdi:cash

  wallbox_akku_reserve:
    name: Speicher nutzen bis
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:home-battery

input_boolean:
  wallbox_akku_freigabe:
    name: Aus Hausakku laden
    icon: mdi:battery-arrow-down

# Fester Arbeitspreis als Sensor. Wer einen dynamischen Tarif hat,
# löscht diesen Block und wählt in der Karte den Sensor der Integration.
template:
  - sensor:
      - name: Strompreis Bezug
        unique_id: wuefl_strompreis_bezug
        unit_of_measurement: ct/kWh
        state_class: measurement
        state: "32.5"

      - name: Strompreis Einspeisung
        unique_id: wuefl_strompreis_einspeisung
        unit_of_measurement: ct/kWh
        state_class: measurement
        state: "8.2"

automation:
  - id: wuefl_wallbox_regelung
    alias: Wallbox – Ladung regeln
    mode: single
    max_exceeded: silent

    variables:
      # ---- anpassen ----------------------------------------------------
      grid_power: sensor.netz_leistung # positiv = Bezug, negativ = Einspeisung
      battery_soc: sensor.hausakku_ladestand
      battery_max_discharge: 3000 # W, die die Speicher maximal fürs Auto liefern
      car_soc: sensor.auto_ladestand
      wallbox_power: sensor.wallbox_leistung
      wallbox_switch: switch.wallbox_laden
      wallbox_current: number.wallbox_ladestrom
      price_sensor: sensor.strompreis_bezug
      phases: 3
      voltage: 230
      # ------------------------------------------------------------------

      modus: "{{ states('input_select.wallbox_modus') }}"
      freigabe: "{{ is_state('input_boolean.wallbox_akku_freigabe', 'on') }}"
      reserve: "{{ states('input_number.wallbox_akku_reserve') | float(0) }}"
      ziel_soc: "{{ states('input_number.wallbox_ziel_soc') | float(100) }}"
      grenze: "{{ states('input_number.wallbox_preisgrenze') | float(99) }}"
      prio: "{{ states('input_select.wallbox_prioritaet') }}"
      max_a: "{{ states('input_number.wallbox_ladestrom') | float(16) }}"

      soc: "{{ states(battery_soc) | float(0) }}"
      preis: "{{ states(price_sensor) | float(99) }}"
      lade_leistung: "{{ states(wallbox_power) | float(0) }}"
      netz: "{{ states(grid_power) | float(0) }}"

      # Einspeisung plus das, was die Wallbox bereits zieht – sonst
      # würde sie sich selbst herunterregeln.
      basis: "{{ (0 - netz) + lade_leistung }}"

      akku_beitrag: >-
        {% if freigabe and soc > reserve %}
          {{ battery_max_discharge if prio == 'Auto zuerst' else battery_max_discharge * 0.5 }}
        {% else %}
          0
        {% endif %}

      ueberschuss: "{{ basis + (akku_beitrag | float(0)) }}"

      solar_ampere: >-
        {{ [[ (ueberschuss / (phases * voltage)) | round(0, 'floor'), max_a | int ] | min, 0 ] | max }}

    triggers:
      # Alle 30 s nachregeln. Wer schneller reagieren will, ergänzt hier
      # einen state-Trigger auf den eigenen Netzsensor.
      - trigger: time_pattern
        seconds: "/30"
      - trigger: state
        entity_id:
          - input_select.wallbox_modus
          - input_select.wallbox_prioritaet
          - input_boolean.wallbox_akku_freigabe
          - input_number.wallbox_akku_reserve
          - input_number.wallbox_preisgrenze
          - input_number.wallbox_ziel_soc

    actions:
      - choose:
          # Ziel erreicht oder Modus aus
          - conditions:
              - condition: template
                value_template: >-
                  {{ modus == 'Aus' or (states(car_soc) | float(0)) >= ziel_soc }}
            sequence:
              - action: switch.turn_off
                target: { entity_id: "{{ wallbox_switch }}" }

          # Schnellladen: volle Leistung, Herkunft egal
          - conditions:
              - condition: template
                value_template: "{{ modus == 'Schnell' }}"
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_current }}" }
                data: { value: "{{ max_a | int }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ wallbox_switch }}" }

          # Solar + günstig: Netzstrom nur, solange der Preis unter der Grenze liegt
          - conditions:
              - condition: template
                value_template: "{{ modus == 'Solar + günstig' and preis <= grenze }}"
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_current }}" }
                data: { value: "{{ max_a | int }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ wallbox_switch }}" }

          # Solar und Solar + günstig bei zu teurem Netzstrom: dem Überschuss folgen
          - conditions:
              - condition: template
                value_template: >-
                  {{ modus in ['Solar', 'Solar + günstig']
                     and (solar_ampere | int(0)) >= 6 }}
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_current }}" }
                data: { value: "{{ solar_ampere | int(6) }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ wallbox_switch }}" }

        default:
          - action: switch.turn_off
            target: { entity_id: "{{ wallbox_switch }}" }
