# =======================================================================
# wuefl_automation.yaml
# Dynamic Wallbox & Energy Management Automation
#
# Alle Entitäten kommen aus der Zuordnung (sensor.we_config, Attribut
# "config"). Dort steht je Pfad entweder der Helfer der Integration
# (z. B. select.we_charge_type_carport) oder die eigene Entität, die du in
# der Zuordnung gewählt hast.
#
# Ablauf: erst werden alle Zielwerte berechnet (Wallbox an/aus, Leistung,
# Akku-Modus), danach wird nur geschrieben, was sich wirklich ändert –
# kein Dauerfeuer auf Modbus/Wechselrichter.
#
# Vorzeichen wie in der Zuordnung beschrieben:
#   Netz     positiv = Bezug,     negativ = Einspeisung
#   Batterie positiv = entladen,  negativ = laden
# =======================================================================

automation:
  - id: wuefl_wallbox_und_speicher_regelung
    alias: "wuefl – Wallbox & Energiemanagement"
    mode: single
    max_exceeded: silent

    trigger:
      - trigger: time_pattern
        seconds: "/30"
      # Globale Helfer haben feste Namen – Änderungen sofort umsetzen
      - trigger: state
        entity_id:
          - select.we_priority_charging
          - switch.we_battery_ussage_charging
          - switch.we_charge_battery_with_grid_bad_weather
          - number.we_battery_ussage_limit_charging
          - number.we_price_limit_charging
      # Wallbox-Helfer heißen nach der Wallbox – daher über die Zuordnung
      - trigger: template
        value_template: >
          {% set cfg = state_attr('sensor.we_config', 'config') or {} %}
          {% set wb = ((cfg.get('wallboxes') or []) + [{}])[0] %}
          {% set ids = [wb.get('charge_type'), wb.get('charge_percent_limit'), wb.get('ignore_percent_limit')]
             | select('string') | list %}
          {{ ids | count > 0 and
             expand(ids) | map(attribute='last_changed') | max > now() - timedelta(seconds=5) }}

    variables:
      # --- Zuordnung ------------------------------------------------------
      cfg: "{{ state_attr('sensor.we_config', 'config') or {} }}"
      wb: "{{ ((cfg.get('wallboxes') or []) + [{}])[0] }}"
      wb_more: "{{ wb.get('more') or {} }}"
      regeln: "{{ cfg.get('wallboxes_config') or {} }}"
      grid: "{{ cfg.get('grid') or {} }}"
      batterien: "{{ cfg.get('battery') or [] }}"
      batt: "{{ (batterien + [{}])[0] }}"
      akku_steuerung: "{{ batt.get('control') or {} }}"

      # --- Entitäten (leer = nicht zugeordnet) ------------------------------
      mode_entity: "{{ wb.get('charge_type', '') }}"
      wallbox_power_set_entity: "{{ wb.get('send_power', '') }}"
      wallbox_activate_entity: "{{ wb.get('activate_station', '') }}"
      target_entity: "{{ wb.get('charge_percent_limit', '') }}"
      ignore_limit_entity: "{{ wb.get('ignore_percent_limit', '') }}"
      car_soc_entity: "{{ wb.get('car_percent', '') }}"
      wallbox_power_sensor: "{{ wb.get('live', '') }}"
      grid_power_entity: "{{ grid.get('live', '') }}"
      price_entity: "{{ grid.get('price_import', '') }}"
      priority_entity: "{{ regeln.get('priority_charging', '') }}"
      use_entity: "{{ regeln.get('battery_ussage_charging', '') }}"
      reserve_entity: "{{ regeln.get('battery_ussage_limit_charging', '') }}"
      limit_entity: "{{ regeln.get('price_limit_charging', '') }}"
      bad_weather_entity: "{{ regeln.get('charge_battery_bad_weather', '') }}"
      batt_soc_entity: "{{ batt.get('percent', '') }}"
      batt_stop_discharging: "{{ akku_steuerung.get('mode_stop_discharging', '') }}"
      batt_force_charge: "{{ akku_steuerung.get('mode_start_charging', '') }}"
      batt_normal_mode: "{{ akku_steuerung.get('normal_mode', '') }}"

      has_wallbox: "{{ mode_entity != '' and wallbox_power_set_entity != '' and wallbox_activate_entity != '' }}"
      has_battery: "{{ batterien | count > 0 }}"
      can_control_battery: "{{ batt_normal_mode != '' and states(batt_normal_mode) not in ['unknown', 'unavailable'] }}"

      # --- Einstellungen ----------------------------------------------------
      modus: "{{ states(mode_entity) if mode_entity else 'Aus' }}"
      prio: "{{ states(priority_entity) }}"
      freigabe: "{{ is_state(use_entity, 'on') }}"
      netzladen_erlaubt: "{{ is_state(bad_weather_entity, 'on') }}"
      reserve: "{{ states(reserve_entity) | float(20) }}"
      grenze: "{{ states(limit_entity) | float(0) }}"
      limit_ignorieren: "{{ is_state(ignore_limit_entity, 'on') }}"
      # Ladeziel-Helfer ist 0.0–1.0, eigene Entitäten oft 0–100
      ziel_soc: >
        {% set v = states(target_entity) | float(1) %}
        {{ v * 100 if v <= 1 else v }}
      car_soc: "{{ states(car_soc_entity) | float(-1) }}"
      # Preis in ct/kWh, €-Sensoren werden umgerechnet
      preis: >
        {% set v = states(price_entity) | float(none) %}
        {% set u = (state_attr(price_entity, 'unit_of_measurement') or '') | lower %}
        {% if v is none %}{{ 999 }}
        {% elif ('€' in u or 'eur' in u) and 'ct' not in u and 'cent' not in u %}{{ v * 100 }}
        {% else %}{{ v }}{% endif %}

      # --- Messwerte in W (kW-Sensoren werden umgerechnet) ------------------
      netz_power: >
        {% set e = grid_power_entity %}
        {% set k = 1000 if (state_attr(e, 'unit_of_measurement') or '') | lower == 'kw' else 1 %}
        {{ states(e) | float(0) * k }}
      wb_power: >
        {% set e = wallbox_power_sensor %}
        {% set k = 1000 if (state_attr(e, 'unit_of_measurement') or '') | lower == 'kw' else 1 %}
        {{ states(e) | float(0) * k }}
      akku_power: >
        {% set ns = namespace(s=0) %}
        {% for b in batterien if b.get('live') %}
          {% set k = 1000 if (state_attr(b.live, 'unit_of_measurement') or '') | lower == 'kw' else 1 %}
          {% set ns.s = ns.s + states(b.live) | float(0) * k %}
        {% endfor %}
        {{ ns.s }}
      batt_soc: "{{ states(batt_soc_entity) | float(0) if has_battery else 0 }}"

      # --- Leistungsgrenzen -------------------------------------------------
      phases: "{{ wb_more.get('phases_value') or 3 }}"
      max_power_cfg: "{{ wb_more.get('max_power_value') or 11000 }}"
      # 6 A je Phase, auf volle 100 W aufgerundet (Schrittweite des Helfers)
      min_charge_w: "{{ ((6 * 230 * phases / 100) | round(0, 'ceil') * 100) | int }}"
      battery_max_discharge_w: 3000

      # --- Solarüberschuss für die Wallbox ----------------------------------
      # Was gerade eingespeist wird plus was die Wallbox schon zieht.
      # Entlädt der Akku, ist das kein Überschuss – außer mit Freigabe
      # (dann darf er bis zur Reserve bis zu battery_max_discharge_w beisteuern).
      # Bei "Auto zuerst" zählt auch, was gerade in den Akku geht.
      akku_abgabe_moeglich: "{{ has_battery and freigabe and batt_soc > reserve + 3 }}"
      ueberschuss_w: >
        {% set s = wb_power - netz_power - [akku_power, 0] | max %}
        {% if has_battery and prio == 'Auto zuerst' %}{% set s = s + [-akku_power, 0] | max %}{% endif %}
        {% if akku_abgabe_moeglich %}{% set s = s + battery_max_discharge_w %}{% endif %}
        {{ [s, 0] | max }}

      # --- Zielwerte --------------------------------------------------------
      # "Solar + günstig" ist bei günstigem Strom wie Schnell, sonst wie Solar
      modus_eff: >
        {% if modus == 'Solar + günstig' %}{{ 'Schnell' if preis < grenze else 'Solar' }}
        {% else %}{{ modus }}{% endif %}
      ziel_erreicht: "{{ not limit_ignorieren and car_soc >= 0 and car_soc >= ziel_soc }}"
      laedt_gerade: "{{ states(wallbox_activate_entity) | float(0) > 0 }}"
      wb_ziel_leistung: >
        {% if modus_eff in ['Aus', 'unknown', 'unavailable'] or ziel_erreicht %}{{ 0 }}
        {% elif modus_eff == 'Schnell' %}{{ max_power_cfg | int }}
        {% else %}
          {# Hysterese: läuft die Wallbox schon, erst 500 W unter der Mindestleistung stoppen #}
          {% set schwelle = min_charge_w - 500 if laedt_gerade else min_charge_w %}
          {% if ueberschuss_w >= schwelle %}
            {{ ([[ueberschuss_w, min_charge_w] | max, max_power_cfg] | min / 100) | int * 100 }}
          {% else %}{{ 0 }}{% endif %}
        {% endif %}
      wb_ziel_aktiv: "{{ 1 if wb_ziel_leistung | int > 0 else 0 }}"

      # Akku: Netzladen bei schlechter Prognose + günstigem Strom (nur mit Schalter)
      prognose_kwh: >
        {% set ns = namespace(s=0) %}
        {% for p in cfg.get('solar') or [] %}
          {% set f = p.get('forecast') %}
          {% set e = f if f is string else (f | first if f else none) %}
          {% if e is string %}{% set ns.s = ns.s + states(e) | float(0) %}{% endif %}
        {% endfor %}
        {{ ns.s }}
      tagesverbrauch_kwh: >
        {% set e = (cfg.get('systemdata') or {}).get('house_base_load') %}
        {{ (states(e) | float(0) * 24 / 1000) if e else 10 }}
      akku_netzladen: "{{ netzladen_erlaubt and preis < grenze and prognose_kwh < tagesverbrauch_kwh and batt_soc < 80 }}"
      # Schnellladen soll den Akku nicht leeren – außer mit Freigabe über der Reserve
      akku_sperren: "{{ wb_ziel_aktiv == 1 and modus_eff == 'Schnell' and not akku_abgabe_moeglich }}"
      akku_ziel: >
        {% if not (has_battery and can_control_battery) %}{{ '' }}
        {% elif akku_netzladen and batt_force_charge %}{{ batt_force_charge }}
        {% elif akku_sperren and batt_stop_discharging %}{{ batt_stop_discharging }}
        {% else %}{{ batt_normal_mode }}{% endif %}
      # Welcher Akku-Modus zuletzt aktiviert wurde (Szene: Zeitstempel,
      # Skript: last_triggered, Schalter: an seit)
      akku_aktuell: >
        {% set ns = namespace(best='', t=as_datetime('1970-01-01T00:00:00+00:00')) %}
        {% for e in [batt_normal_mode, batt_stop_discharging, batt_force_charge] if e %}
          {% set d = e.split('.')[0] %}
          {% if d == 'scene' %}{% set t = as_datetime(states(e), none) %}
          {% elif d == 'script' %}{% set t = state_attr(e, 'last_triggered') %}
          {% elif is_state(e, 'on') %}{% set t = (expand(e) | first).last_changed %}
          {% else %}{% set t = none %}{% endif %}
          {% if t is not none and t > ns.t %}{% set ns.best = e %}{% set ns.t = t %}{% endif %}
        {% endfor %}
        {{ ns.best }}

    actions:
      # -----------------------------------------------------------------
      # 1. WALLBOX (nur schreiben, wenn sich etwas ändert)
      # -----------------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ has_wallbox }}"
        then:
          # Beim Abschalten erst freigeben=0, dann Leistung; beim Einschalten umgekehrt
          - if:
              - condition: template
                value_template: "{{ wb_ziel_aktiv == 0 and states(wallbox_activate_entity) | float(-1) != 0 }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_activate_entity }}" }
                data: { value: 0 }
          - if:
              - condition: template
                value_template: "{{ states(wallbox_power_set_entity) | float(-1) != wb_ziel_leistung | float }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_power_set_entity }}" }
                data: { value: "{{ wb_ziel_leistung }}" }
          - if:
              - condition: template
                value_template: "{{ wb_ziel_aktiv == 1 and states(wallbox_activate_entity) | float(-1) != 1 }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_activate_entity }}" }
                data: { value: 1 }

      # -----------------------------------------------------------------
      # 2. HAUSAKKU (Szene/Skript/Schalter nur bei Wechsel auslösen)
      # -----------------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ akku_ziel != '' and akku_ziel != akku_aktuell }}"
        then:
          - action: homeassistant.turn_on
            target: { entity_id: "{{ akku_ziel }}" }
