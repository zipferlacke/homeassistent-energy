# wuefl_wallbox.yaml
#
# Das ist ein Package und gehoert nach config/packages/.
# Voraussetzung in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Ein Beispiel-Preissensor und die Automation, die aus Modus und Ueberschuss
# einen Ladestrom macht.
#
# Lademodus, Ladestrom, Ladeziel und die vier anlagenweiten Laderegler
# (Hausakku-Freigabe, Batteriereserve, Prioritaet, Preisgrenze) stehen NICHT
# mehr hier drin — die legt die Integration "wuefl Energie" selbst an, sobald
# in der Zuordnung eine Wallbox existiert. Zu finden unter Einstellungen →
# Geraete & Dienste → Entitaeten, Suche "wuefl", oder direkt in der Ansicht
# Einstellungen des wuefl-Energie-Dashboards.
#
# Bei mehreren Wallboxen: diese Datei kopieren, in den Automations-
# Variablen unten die Entitaets-IDs der zweiten Wallbox eintragen und der
# Automation eine neue "id:" geben (sonst ueberschreiben sich die beiden
# Kopien gegenseitig).

# Fester Arbeitspreis als Sensor. Wer einen dynamischen Tarif hat,
# löscht diesen Block und wählt in der Karte den Sensor der Integration.
template:
  - sensor:
      - name: Strompreis Bezug
        unique_id: wuefl_strompreis_bezug
        unit_of_measurement: ct/kWh
        state_class: measurement
        state: "32.5"

      - name: Strompreis Einspeisung
        unique_id: wuefl_strompreis_einspeisung
        unit_of_measurement: ct/kWh
        state_class: measurement
        state: "8.2"

automation:
  - id: wuefl_wallbox_regelung
    alias: Wallbox – Ladung regeln
    mode: single
    max_exceeded: silent

    variables:
      # ---- anpassen ----------------------------------------------------
      grid_power: sensor.netz_leistung # positiv = Bezug, negativ = Einspeisung
      battery_soc: sensor.hausakku_ladestand
      battery_max_discharge: 3000 # W, die die Batterie maximal fürs Auto liefern
      car_soc: sensor.auto_ladestand
      wallbox_power: sensor.wallbox_leistung
      wallbox_switch: switch.wallbox_laden
      price_sensor: sensor.strompreis_bezug
      phases: 3
      voltage: 230

      # Diese sechs kommen von der Integration selbst — Namen stimmen mit
      # der Vorschau/README überein, solange nur eine Wallbox existiert.
      # Bei mehreren Wallboxen stehen die tatsächlichen Namen in
      # Einstellungen → Geräte & Dienste → Entitäten (Suche "wuefl").
      wallbox_current: number.wuefl_wallbox_wallbox_1_ladestrom
      mode_entity: select.wuefl_wallbox_wallbox_1_modus
      target_entity: number.wuefl_wallbox_wallbox_1_ladeziel
      priority_entity: select.wuefl_prioritaet
      reserve_entity: number.wuefl_Batteriereserve
      use_entity: switch.wuefl_hausakku_freigabe
      limit_entity: number.wuefl_preisgrenze_laden
      # ------------------------------------------------------------------

      modus: "{{ states(mode_entity) }}"
      freigabe: "{{ is_state(use_entity, 'on') }}"
      reserve: "{{ states(reserve_entity) | float(0) }}"
      ziel_soc: "{{ states(target_entity) | float(100) }}"
      grenze: "{{ states(limit_entity) | float(99) }}"
      prio: "{{ states(priority_entity) }}"
      max_a: "{{ states(wallbox_current) | float(16) }}"

      soc: "{{ states(battery_soc) | float(0) }}"
      preis: "{{ states(price_sensor) | float(99) }}"
      lade_leistung: "{{ states(wallbox_power) | float(0) }}"
      netz: "{{ states(grid_power) | float(0) }}"

      # Einspeisung plus das, was die Wallbox bereits zieht – sonst
      # würde sie sich selbst herunterregeln.
      basis: "{{ (0 - netz) + lade_leistung }}"

      akku_beitrag: >-
        {% if freigabe and soc > reserve %}
          {{ battery_max_discharge if prio == 'Auto zuerst' else battery_max_discharge * 0.5 }}
        {% else %}
          0
        {% endif %}

      ueberschuss: "{{ basis + (akku_beitrag | float(0)) }}"

      solar_ampere: >-
        {{ [[ (ueberschuss / (phases * voltage)) | round(0, 'floor'), max_a | int ] | min, 0 ] | max }}

    triggers:
      # Alle 30 s nachregeln. Wer schneller reagieren will, ergänzt hier
      # einen state-Trigger auf den eigenen Netzsensor.
      - trigger: time_pattern
        seconds: "/30"
      - trigger: state
        entity_id:
          - select.wuefl_wallbox_wallbox_1_modus
          - select.wuefl_prioritaet
          - switch.wuefl_hausakku_freigabe
          - number.wuefl_Batteriereserve
          - number.wuefl_preisgrenze_laden
          - number.wuefl_wallbox_wallbox_1_ladeziel

    actions:
      - choose:
          # Ziel erreicht oder Modus aus
          - conditions:
              - condition: template
                value_template: >-
                  {{ modus == 'Aus' or (states(car_soc) | float(0)) >= ziel_soc }}
            sequence:
              - action: switch.turn_off
                target: { entity_id: "{{ wallbox_switch }}" }

          # Schnellladen: volle Leistung, Herkunft egal
          - conditions:
              - condition: template
                value_template: "{{ modus == 'Schnell' }}"
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_current }}" }
                data: { value: "{{ max_a | int }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ wallbox_switch }}" }

          # Solar + günstig: Netzstrom nur, solange der Preis unter der Grenze liegt
          - conditions:
              - condition: template
                value_template: "{{ modus == 'Solar + günstig' and preis <= grenze }}"
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_current }}" }
                data: { value: "{{ max_a | int }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ wallbox_switch }}" }

          # Solar und Solar + günstig bei zu teurem Netzstrom: dem Überschuss folgen
          - conditions:
              - condition: template
                value_template: >-
                  {{ modus in ['Solar', 'Solar + günstig']
                     and (solar_ampere | int(0)) >= 6 }}
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ wallbox_current }}" }
                data: { value: "{{ solar_ampere | int(6) }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ wallbox_switch }}" }

        default:
          - action: switch.turn_off
            target: { entity_id: "{{ wallbox_switch }}" }
